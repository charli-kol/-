<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
  <title>KOL实习生管理系统 · 多地区日报分析</title>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f5f7fc;
      color: #1e293b;
      padding: 30px 25px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }

    .app-container {
      max-width: 1400px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    .top-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      background: white;
      padding: 18px 30px;
      border-radius: 24px;
      box-shadow: 0 10px 25px -10px rgba(0,0,0,0.04);
    }

    .logo h1 {
      font-size: 1.8rem;
      font-weight: 700;
      background: linear-gradient(135deg, #1e293b, #4f46e5);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .logo span {
      font-size: 0.9rem;
      color: #64748b;
      font-weight: 500;
    }

    .region-tabs {
      display: flex;
      gap: 10px;
      background: #f1f5f9;
      padding: 6px;
      border-radius: 40px;
    }

    .tab-btn {
      padding: 10px 24px;
      border: none;
      background: transparent;
      border-radius: 30px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      color: #475569;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .tab-btn i {
      font-size: 0.9rem;
    }

    .tab-btn.active {
      background: white;
      color: #4f46e5;
      box-shadow: 0 4px 12px rgba(79,70,229,0.15);
    }

    .region-panel {
      display: none;
      gap: 24px;
      flex-wrap: wrap;
    }

    .region-panel.active {
      display: flex;
    }

    .intern-sidebar {
      flex: 0 0 300px;
      background: white;
      border-radius: 24px;
      padding: 20px;
      box-shadow: 0 10px 25px -8px rgba(0,0,0,0.04);
      height: fit-content;
    }

    .data-main {
      flex: 1;
      background: white;
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 10px 25px -8px rgba(0,0,0,0.04);
      min-width: 0;
    }

    .intern-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 12px;
      border-radius: 16px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: 0.2s;
      border: 1px solid transparent;
    }

    .intern-item:hover {
      background: #f8fafc;
    }

    .intern-item.selected {
      background: #eef2ff;
      border-color: #4f46e5;
    }

    .intern-name {
      font-weight: 700;
    }

    .add-intern-btn {
      background: #10b981;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 30px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 12px;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .standard-btn {
      background: #f59e0b;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 30px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 0.85rem;
    }

    .table-wrapper {
      overflow-x: auto;
      border-radius: 16px;
      border: 1px solid #e9eef3;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
      white-space: nowrap;
    }

    th {
      background: #f8fafc;
      padding: 14px 12px;
      text-align: left;
      font-weight: 600;
      color: #334155;
      position: relative;
    }

    th .select-all-checkbox {
      margin-right: 4px;
    }

    td {
      padding: 12px;
      border-bottom: 1px solid #f1f5f9;
    }

    .batch-input-row {
      background: #fdf4ff;
    }

    input, select {
      padding: 8px 12px;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      font-family: inherit;
      width: 100px;
    }

    .small-input {
      width: 80px;
    }

    .analysis-card {
      background: #f9fafb;
      border-radius: 20px;
      padding: 20px;
      margin-top: 24px;
    }

    .ranking-card {
      background: #fefce8;
      border-radius: 20px;
      padding: 20px;
      margin-top: 16px;
    }

    .rank-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      border-radius: 12px;
      margin-bottom: 6px;
      background: white;
    }

    .rank-badge {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.85rem;
      color: white;
    }

    .rank-1 { background: #f59e0b; }
    .rank-2 { background: #94a3b8; }
    .rank-3 { background: #b45309; }
    .rank-other { background: #cbd5e1; color: #475569; }

    .status-pass { color: #10b981; font-weight: 700; }
    .status-fail { color: #ef4444; font-weight: 700; }

    button {
      background: #4f46e5;
      border: none;
      color: white;
      font-weight: 600;
      padding: 10px 20px;
      border-radius: 30px;
      cursor: pointer;
      transition: 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    button.secondary {
      background: #f1f5f9;
      color: #1e293b;
    }

    button.danger {
      background: #ef4444;
      color: white;
    }

    .edit-name-btn {
      background: none;
      border: none;
      color: #64748b;
      cursor: pointer;
      padding: 4px 6px;
      font-size: 0.85rem;
    }

    .edit-name-btn:hover {
      color: #4f46e5;
    }

    .delete-intern-btn {
      background: none;
      border: none;
      color: #ef4444;
      cursor: pointer;
      padding: 4px 6px;
      font-size: 0.85rem;
    }

    .delete-intern-btn:hover {
      color: #dc2626;
    }

    /* 分页样式 */
    .pagination {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 16px;
      flex-wrap: wrap;
    }

    .pagination button {
      padding: 8px 14px;
      font-size: 0.85rem;
      background: #f1f5f9;
      color: #334155;
      border-radius: 8px;
    }

    .pagination button.active {
      background: #4f46e5;
      color: white;
    }

    .pagination button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .pagination .page-info {
      font-size: 0.85rem;
      color: #64748b;
      padding: 0 8px;
    }

    /* 文件上传区域 */
    .upload-area {
      border: 2px dashed #cbd5e1;
      border-radius: 16px;
      padding: 30px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      background: #fafbfc;
      margin-top: 16px;
    }

    .upload-area:hover {
      border-color: #4f46e5;
      background: #f5f3ff;
    }

    .upload-area i {
      font-size: 2.5rem;
      color: #4f46e5;
      margin-bottom: 10px;
    }

    .upload-area p {
      color: #64748b;
      margin: 5px 0;
    }

    .upload-area .file-types {
      font-size: 0.8rem;
      color: #94a3b8;
    }

    .mapping-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
      margin-top: 16px;
    }

    .mapping-table th, .mapping-table td {
      padding: 10px 14px;
      border: 1px solid #e2e8f0;
      text-align: left;
    }

    .mapping-table th {
      background: #f8fafc;
      font-weight: 600;
    }

    .mapping-table select {
      width: 100%;
      padding: 6px 10px;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
    }

    .preview-scroll {
      max-height: 250px;
      overflow-y: auto;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      margin-top: 12px;
    }

    .tag {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 600;
      margin: 2px;
    }

    .tag-success { background: #d1fae5; color: #065f46; }
    .tag-warning { background: #fef3c7; color: #92400e; }
    .tag-info { background: #dbeafe; color: #1e40af; }

    /* 弹窗 */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      backdrop-filter: blur(2px);
    }

    .modal-box {
      background: white;
      border-radius: 20px;
      padding: 28px 30px;
      width: 450px;
      max-width: 90vw;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.25);
      position: relative;
      animation: modalFadeIn 0.2s ease;
      max-height: 85vh;
      overflow-y: auto;
    }

    @keyframes modalFadeIn {
      from { opacity: 0; transform: scale(0.95) translateY(-10px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .modal-box h3 {
      margin-bottom: 16px;
      font-size: 1.2rem;
      color: #1e293b;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .modal-box label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
      color: #475569;
      font-size: 0.9rem;
    }

    .modal-box input, .modal-box select {
      width: 100%;
      padding: 10px 14px;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      font-size: 0.95rem;
      margin-bottom: 14px;
      outline: none;
      box-sizing: border-box;
    }

    .modal-box input:focus, .modal-box select:focus {
      border-color: #4f46e5;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 8px;
    }

    .modal-actions button {
      padding: 10px 24px;
      border-radius: 25px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      font-size: 0.9rem;
    }

    .modal-actions .cancel-btn {
      background: #f1f5f9;
      color: #475569;
    }

    .modal-actions .confirm-btn {
      background: #4f46e5;
      color: white;
    }

    .standard-row {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 10px;
    }

    .standard-row label {
      min-width: 100px;
      margin-bottom: 0;
    }

    .standard-row input {
      width: 100px;
      margin-bottom: 0;
    }

    .toolbar {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    /* 数据展示视图切换 */
    .view-tabs {
      display: flex;
      gap: 4px;
      background: #f1f5f9;
      padding: 4px;
      border-radius: 20px;
      margin-bottom: 16px;
    }

    .view-tab {
      padding: 8px 20px;
      border: none;
      background: transparent;
      border-radius: 16px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      color: #64748b;
      transition: 0.2s;
    }

    .view-tab.active {
      background: white;
      color: #4f46e5;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    /* 周/月汇总卡片 */
    .summary-cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }

    .summary-card {
      background: white;
      border-radius: 14px;
      padding: 14px;
      text-align: center;
      border: 1px solid #e9eef3;
    }

    .summary-card .value {
      font-size: 1.6rem;
      font-weight: 700;
      color: #1e293b;
    }

    .summary-card .label {
      font-size: 0.75rem;
      color: #64748b;
      margin-top: 4px;
    }

    .summary-card .trend {
      font-size: 0.7rem;
      margin-top: 4px;
    }

    .trend-up { color: #10b981; }
    .trend-down { color: #ef4444; }
    .trend-flat { color: #94a3b8; }

    /* 维度开关 */
    .dimension-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 12px;
    }

    .dim-tag {
      padding: 6px 12px;
      border-radius: 16px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid #e2e8f0;
      background: white;
      color: #64748b;
      transition: 0.2s;
    }

    .dim-tag.active {
      background: #4f46e5;
      color: white;
      border-color: #4f46e5;
    }

    @media (max-width: 850px) {
      .region-panel {
        flex-direction: column;
      }
      .intern-sidebar {
        flex: auto;
      }
      .summary-cards {
        grid-template-columns: repeat(3, 1fr);
      }
    }
  </style>
</head>
<body>
<div class="app-container">
  <div class="top-header">
    <div class="logo">
      <h1>📊 KOL实习生管理</h1>
      <span>台湾 · 土耳其 · 西语大区 · 巴西</span>
    </div>
    <div class="region-tabs" id="regionTabs">
      <button class="tab-btn active" data-region="taiwan"><i class="fas fa-flag"></i> 台湾</button>
      <button class="tab-btn" data-region="turkey"><i class="fas fa-flag"></i> 土耳其</button>
      <button class="tab-btn" data-region="spanish"><i class="fas fa-globe"></i> 西语大区</button>
      <button class="tab-btn" data-region="brazil"><i class="fas fa-flag"></i> 巴西</button>
    </div>
  </div>

  <div id="regionPanelsContainer"></div>
</div>

<script>
  (function() {
    const REGIONS = [
      { id: 'taiwan', name: '台湾', icon: 'fa-flag' },
      { id: 'turkey', name: '土耳其', icon: 'fa-flag' },
      { id: 'spanish', name: '西语大区', icon: 'fa-globe' },
      { id: 'brazil', name: '巴西', icon: 'fa-flag' }
    ];

    // 默认维度列表
    const ALL_DIMENSIONS = [
      { key: 'approach', label: '搭讪人数', icon: '💬' },
      { key: 'reply', label: '回复人数', icon: '↩️' },
      { key: 'newHost', label: '新增主播', icon: '🎤' },
      { key: 'comments', label: '评论数', icon: '💭' },
      { key: 'storyPost', label: 'Story/Post', icon: '📱' },
      { key: 'video', label: '视频数', icon: '🎬' },
      { key: 'cost', label: '花费($)', icon: '💰' }
    ];

    let interns = [];

    function loadInternsFromStorage() {
      const saved = localStorage.getItem('kolInterns');
      if (saved) {
        try { interns = JSON.parse(saved); } catch (e) { initDefaultInterns(); }
      } else {
        initDefaultInterns();
        saveInternsToStorage();
      }
    }

    function initDefaultInterns() {
      interns = [
        { id: 'tw1', name: '陈雅婷', region: 'taiwan' },
        { id: 'tw2', name: '林俊杰', region: 'taiwan' },
        { id: 'tr1', name: 'Elif Demir', region: 'turkey' },
        { id: 'tr2', name: 'Mehmet Yılmaz', region: 'turkey' },
        { id: 'es1', name: 'Sofía García', region: 'spanish' },
        { id: 'es2', name: 'Carlos Ruiz', region: 'spanish' },
        { id: 'br1', name: 'Ana Silva', region: 'brazil' },
        { id: 'br2', name: 'João Costa', region: 'brazil' }
      ];
    }

    function saveInternsToStorage() {
      localStorage.setItem('kolInterns', JSON.stringify(interns));
    }

    function generateInternId(regionId) {
      const regionInterns = interns.filter(i => i.region === regionId);
      const prefix = regionId.substring(0, 2);
      let maxNum = 0;
      regionInterns.forEach(intern => {
        const match = intern.id.match(/\d+$/);
        if (match) { const num = parseInt(match[0]); if (num > maxNum) maxNum = num; }
      });
      return `${prefix}${maxNum + 1}`;
    }

    let dailyRecords = {};
    let currentPage = {};
    const PAGE_SIZE = 10;

    function loadDataFromStorage() {
      const saved = localStorage.getItem('kolDailyRecords');
      if (saved) {
        try { dailyRecords = JSON.parse(saved); } catch (e) { initEmptyRecords(); }
      } else {
        initEmptyRecords();
        seedSampleData();
        saveDataToStorage();
      }
    }

    function initEmptyRecords() {
      dailyRecords = {};
      interns.forEach(intern => { dailyRecords[intern.id] = []; });
    }

    function saveDataToStorage() {
      localStorage.setItem('kolDailyRecords', JSON.stringify(dailyRecords));
    }

    function seedSampleData() {
      const today = new Date().toISOString().split('T')[0];
      const y = new Date(Date.now() - 86400000).toISOString().split('T')[0];
      if (dailyRecords['tw1']) dailyRecords['tw1'].push({ date: y, approach: 12, reply: 8, newHost: 2, comments: 34, storyPost: 5, video: 2, cost: 150 });
      if (dailyRecords['tw1']) dailyRecords['tw1'].push({ date: today, approach: 15, reply: 10, newHost: 3, comments: 40, storyPost: 6, video: 3, cost: 200 });
      if (dailyRecords['tr1']) dailyRecords['tr1'].push({ date: y, approach: 20, reply: 14, newHost: 4, comments: 55, storyPost: 8, video: 4, cost: 320 });
      if (dailyRecords['es1']) dailyRecords['es1'].push({ date: today, approach: 18, reply: 12, newHost: 5, comments: 48, storyPost: 7, video: 3, cost: 280 });
      if (dailyRecords['br1']) dailyRecords['br1'].push({ date: y, approach: 22, reply: 16, newHost: 6, comments: 62, storyPost: 10, video: 5, cost: 400 });
    }

    // 周标准存储 - 现在每个地区可以自定义维度和标准
    let weeklyStandards = {};

    function loadStandardsFromStorage() {
      const saved = localStorage.getItem('kolWeeklyStandards');
      if (saved) {
        try { weeklyStandards = JSON.parse(saved); } catch (e) { initDefaultStandards(); }
      } else {
        initDefaultStandards();
        saveStandardsToStorage();
      }
    }

    function initDefaultStandards() {
      weeklyStandards = {};
      REGIONS.forEach(region => {
        weeklyStandards[region.id] = {
          enabledDimensions: ['approach', 'reply', 'newHost', 'comments', 'storyPost', 'video', 'cost'],
          targets: {
            approach: region.id === 'taiwan' ? 50 : region.id === 'turkey' ? 60 : region.id === 'spanish' ? 55 : 65,
            reply: region.id === 'taiwan' ? 30 : region.id === 'turkey' ? 35 : region.id === 'spanish' ? 32 : 40,
            newHost: region.id === 'taiwan' ? 8 : region.id === 'turkey' ? 10 : region.id === 'spanish' ? 9 : 12,
            comments: region.id === 'taiwan' ? 100 : region.id === 'turkey' ? 120 : region.id === 'spanish' ? 110 : 140,
            storyPost: region.id === 'taiwan' ? 20 : region.id === 'turkey' ? 25 : region.id === 'spanish' ? 22 : 28,
            video: region.id === 'taiwan' ? 8 : region.id === 'turkey' ? 10 : region.id === 'spanish' ? 9 : 12,
            cost: region.id === 'taiwan' ? 500 : region.id === 'turkey' ? 600 : region.id === 'spanish' ? 550 : 700
          }
        };
      });
    }

    function saveStandardsToStorage() {
      localStorage.setItem('kolWeeklyStandards', JSON.stringify(weeklyStandards));
    }

    loadInternsFromStorage();
    loadDataFromStorage();
    loadStandardsFromStorage();

    let currentRegion = 'taiwan';
    let selectedInternId = null;
    let selectedRows = {};
    let dataViewMode = {}; // 'week' | 'month' | 'all'

    function getInternsByRegion(regionId) {
      return interns.filter(i => i.region === regionId);
    }

    function getRegionName(regionId) {
      const region = REGIONS.find(r => r.id === regionId);
      return region ? region.name : regionId;
    }

    function getWeekStart() {
      const now = new Date();
      const day = now.getDay();
      const diff = now.getDate() - day + (day === 0 ? -6 : 1);
      return new Date(new Date(now.setDate(diff)).toISOString().split('T')[0]);
    }

    function getMonthStart() {
      const now = new Date();
      return new Date(now.getFullYear(), now.getMonth(), 1).toISOString().split('T')[0];
    }

    function getWeekRecords(internId) {
      const weekStart = getWeekStart().toISOString().split('T')[0];
      const records = dailyRecords[internId] || [];
      return records.filter(r => r.date >= weekStart);
    }

    function getMonthRecords(internId) {
      const monthStart = getMonthStart();
      const records = dailyRecords[internId] || [];
      return records.filter(r => r.date >= monthStart);
    }

    function calculateScore(records) {
      return records.reduce((s, r) => {
        return s + r.approach + r.reply + r.newHost * 3 + r.comments + r.storyPost * 2 + r.video * 3;
      }, 0);
    }

    function getPagedRecords(internId, page) {
      const records = dailyRecords[internId] || [];
      const totalPages = Math.ceil(records.length / PAGE_SIZE) || 1;
      const p = Math.min(Math.max(page || 1, 1), totalPages);
      const start = (p - 1) * PAGE_SIZE;
      return {
        records: records.slice(start, start + PAGE_SIZE),
        page: p,
        totalPages: totalPages,
        total: records.length
      };
    }

    function renderSummaryCards(regionId, internId, view) {
      const cardsDiv = document.getElementById(`summaryCards-${regionId}`);
      if (!cardsDiv) return;

      const standardConfig = weeklyStandards[regionId] || { enabledDimensions: ALL_DIMENSIONS.map(d => d.key), targets: {} };
      const enabledDims = standardConfig.enabledDimensions || ALL_DIMENSIONS.map(d => d.key);

      let records;
      if (view === 'week') {
        records = getWeekRecords(internId);
      } else if (view === 'month') {
        records = getMonthRecords(internId);
      } else {
        records = dailyRecords[internId] || [];
      }

      if (records.length === 0) {
        cardsDiv.innerHTML = '<p style="color:#94a3b8; padding:20px; text-align:center;">暂无数据</p>';
        return;
      }

      const totals = {};
      ALL_DIMENSIONS.forEach(dim => {
        totals[dim.key] = records.reduce((s, r) => s + (r[dim.key] || 0), 0);
      });

      cardsDiv.innerHTML = ALL_DIMENSIONS
        .filter(dim => enabledDims.includes(dim.key))
        .map(dim => {
          const target = (standardConfig.targets && standardConfig.targets[dim.key]) || 0;
          const value = totals[dim.key];
          const pct = target > 0 ? Math.round(value / target * 100) : 0;
          let trendClass = 'trend-flat';
          let trendIcon = '➡️';
          if (pct >= 100) { trendClass = 'trend-up'; trendIcon = '✅'; }
          else if (pct >= 70) { trendClass = 'trend-up'; trendIcon = '📈'; }
          else if (pct < 50) { trendClass = 'trend-down'; trendIcon = '⚠️'; }

          return `
            <div class="summary-card">
              <div class="value">${dim.icon} ${value.toLocaleString()}</div>
              <div class="label">${dim.label}</div>
              ${target > 0 ? `<div class="trend ${trendClass}">${trendIcon} 目标 ${target} (${pct}%)</div>` : ''}
            </div>
          `;
        }).join('');
    }

          <div id="uploadPreview-${regionId}" style="display:none;">

            <div class="pagination" id="previewPagination-${regionId}"></div>
            
            <div style="margin-top:16px;">
              <h4 style="font-size:1rem; margin-bottom:8px;">🔗 列映射设置（仅显示表格中有的列）</h4>
              <p style="font-size:0.8rem; color:#64748b; margin-bottom:10px;">
                系统只识别文件中实际存在的列。请确认映射关系。
              </p>
              <div id="mappingConfig-${regionId}"></div>
            </div>

            <div style="margin-top:16px;">
              <label style="font-weight:600; display:block; margin-bottom:6px;">📅 默认日期（如文件中无日期列）</label>

            <div class="modal-actions" style="margin-top:16px;">
              <button class="cancel-btn" id="cancelUploadBtn">取消</button>
              <button class="confirm-btn" id="confirmUploadBtn"><i class="fas fa-check"></i> 确认导入</button>
            </div>
          </div>
        </div>
      `;
      document.body.appendChild(overlay);

      let parsedData = [];
      let fileHeaders = [];
      let columnMapping = {};
      let previewPage = 1;
      const PREVIEW_PAGE_SIZE = 8;

      const dropZone = document.getElementById(`uploadDropZone-${regionId}`);
      const fileInput = document.getElementById(`fileInput-${regionId}`);

      dropZone.addEventListener('click', () => fileInput.click());
      dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.style.borderColor = '#4f46e5'; dropZone.style.background = '#f5f3ff'; });
      dropZone.addEventListener('dragleave', () => { dropZone.style.borderColor = '#cbd5e1'; dropZone.style.background = '#fafbfc'; });
      dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.style.borderColor = '#cbd5e1';
        dropZone.style.background = '#fafbfc';
        const file = e.dataTransfer.files[0];
        if (file) processFile(file);
      });
      fileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) processFile(file);
      });

      function processFile(file) {
        const fileName = file.name.toLowerCase();
        
        if (fileName.endsWith('.csv')) {
          const reader = new FileReader();
          reader.onload = function(e) { parseCSV(e.target.result); };
          reader.readAsText(file);
        } else if (fileName.endsWith('.xlsx') || fileName.endsWith('.xls')) {
          const reader = new FileReader();
          reader.onload = function(e) {
            try {
              const data = new Uint8Array(e.target.result);
              const workbook = XLSX.read(data, { type: 'array' });
              const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
              const csvText = XLSX.utils.sheet_to_csv(firstSheet);
              parseCSV(csvText);
            } catch (err) {
              alert('Excel文件解析失败，请确保文件格式正确。\n错误信息：' + err.message);
            }
          };
          reader.readAsArrayBuffer(file);
        } else {
          alert('不支持的文件格式，请上传 .csv 或 .xlsx 文件');
        }
      }

      function parseCSV(text) {
        const lines = text.split('\n').filter(line => line.trim() !== '');
        if (lines.length < 2) { alert('文件内容不足'); return; }

        fileHeaders = parseCSVLine(lines[0]);
        parsedData = [];
        for (let i = 1; i < lines.length; i++) {
          const values = parseCSVLine(lines[i]);
          if (values.length > 0 && values.some(v => v.trim() !== '')) {
            const row = {};
            fileHeaders.forEach((header, idx) => { row[header] = values[idx] || ''; });
            parsedData.push(row);
          }
        }

        if (parsedData.length === 0) { alert('未解析到有效数据行'); return; }

        autoMapColumns();
        previewPage = 1;
        showPreview();
      }

      function parseCSVLine(line) {
        const result = [];
        let current = '';
        let inQuotes = false;
        for (let i = 0; i < line.length; i++) {
          const char = line[i];
          if (char === '"') { inQuotes = !inQuotes; }
          else if (char === ',' && !inQuotes) { result.push(current.trim()); current = ''; }
          else { current += char; }
        }
        result.push(current.trim());
        return result;
      }

      function autoMapColumns() {
        const targetFields = {};
        ALL_DIMENSIONS.forEach(dim => {
          targetFields[dim.key] = [dim.label, dim.key];
        });
        targetFields['date'] = ['日期', 'date', '时间', '日报日期', 'day'];

        columnMapping = {};
        fileHeaders.forEach(header => {
          const headerLower = header.toLowerCase().replace(/[\s\/\-_]/g, '');
          for (const [field, keywords] of Object.entries(targetFields)) {
            if (columnMapping[field]) continue;
            for (const keyword of keywords) {
              const kwLower = keyword.toLowerCase().replace(/[\s\/\-_]/g, '');
              if (headerLower.includes(kwLower) || kwLower.includes(headerLower)) {
                columnMapping[field] = header;
                break;
              }
            }
          }
        });
      }

      function renderPreviewPage() {
        const totalPages = Math.ceil(parsedData.length / PREVIEW_PAGE_SIZE) || 1;
        if (previewPage > totalPages) previewPage = totalPages;
        const start = (previewPage - 1) * PREVIEW_PAGE_SIZE;
        const pageData = parsedData.slice(start, start + PREVIEW_PAGE_SIZE);

        const previewTable = document.getElementById(`previewTable-${regionId}`);
        let tableHTML = '<table class="mapping-table"><thead><tr>';
        fileHeaders.forEach(h => tableHTML += `<th>${h}</th>`);
        tableHTML += '</tr></thead><tbody>';
        
        pageData.forEach(row => {
          tableHTML += '<tr>';
          fileHeaders.forEach(h => tableHTML += `<td>${row[h] || ''}</td>`);
          tableHTML += '</tr>';
        });
        
        tableHTML += '</tbody></table>';
        previewTable.innerHTML = tableHTML;

        const pagDiv = document.getElementById(`previewPagination-${regionId}`);
        pagDiv.innerHTML = `
          <button ${previewPage <= 1 ? 'disabled' : ''} id="prevPreviewPage">上一页</button>
          <span class="page-info">第 ${previewPage} / ${totalPages} 页（共 ${parsedData.length} 条）</span>
          <button ${previewPage >= totalPages ? 'disabled' : ''} id="nextPreviewPage">下一页</button>
        `;

        const prevBtn = document.getElementById('prevPreviewPage');
        const nextBtn = document.getElementById('nextPreviewPage');
        if (prevBtn) prevBtn.addEventListener('click', () => { previewPage--; renderPreviewPage(); });
        if (nextBtn) nextBtn.addEventListener('click', () => { previewPage++; renderPreviewPage(); });
      }

      function showPreview() {
        document.getElementById(`uploadDropZone-${regionId}`).style.display = 'none';
        document.getElementById(`uploadPreview-${regionId}`).style.display = 'block';
        document.getElementById(`rowCount-${regionId}`).textContent = `共 ${parsedData.length} 行数据`;

        renderPreviewPage();

        const mappingDiv = document.getElementById(`mappingConfig-${regionId}`);
        const allDims = [
          { key: 'date', label: '📅 日期' },
          ...ALL_DIMENSIONS.map(d => ({ key: d.key, label: `${d.icon} ${d.label}` }))
        ];

        mappingDiv.innerHTML = allDims.map(dim => {
          const mapped = columnMapping[dim.key] || '';
          return `
            <div style="display:flex; align-items:center; gap:12px; margin-bottom:8px;">
              <label style="min-width:130px; font-weight:500;">${dim.label}：</label>
              <select id="map-${dim.key}-${regionId}" style="flex:1;">
                <option value="">-- 不映射 --</option>
                ${fileHeaders.map(h => `<option value="${h}" ${mapped === h ? 'selected' : ''}>${h}</option>`).join('')}
              </select>
              ${mapped ? '<span class="tag tag-success">已匹配</span>' : '<span class="tag tag-warning">待选择</span>'}
            </div>
          `;
        }).join('');
      }

      document.getElementById('cancelUploadBtn').addEventListener('click', () => overlay.remove());

      document.getElementById('confirmUploadBtn').addEventListener('click', () => {
        const finalMapping = {};
        ['date', ...ALL_DIMENSIONS.map(d => d.key)].forEach(dim => {
          const select = document.getElementById(`map-${dim}-${regionId}`);
          if (select && select.value) finalMapping[dim] = select.value;
        });

        const defaultDate = document.getElementById(`defaultDate-${regionId}`).value;
        let importCount = 0;

        parsedData.forEach(row => {
          let validDate = defaultDate;
          if (finalMapping['date'] && row[finalMapping['date']]) {
            const parsed = new Date(row[finalMapping['date']]);
            if (!isNaN(parsed.getTime())) validDate = parsed.toISOString().split('T')[0];
          }

          const record = { date: validDate };
          ALL_DIMENSIONS.forEach(dim => {
            record[dim.key] = parseInt(row[finalMapping[dim.key]]) || 0;
          });

          if (selectedInternId) {
            dailyRecords[selectedInternId].push({...record});
            importCount++;
          }
        });

        if (selectedInternId) {
          dailyRecords[selectedInternId].sort((a, b) => new Date(a.date) - new Date(b.date));
        }
        saveDataToStorage();
        overlay.remove();
        alert(`✅ 成功导入 ${importCount} 条记录！`);
        if (selectedInternId) {
          currentPage[selectedInternId] = 1;
          selectedRows[selectedInternId] = new Set();
          refreshDataDisplay(regionId, selectedInternId);
          renderRanking(regionId);
        }
      });

      overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });
    }

          <div style="display:flex; align-items:center; gap:6px;">
            <button class="edit-name-btn" data-id="${intern.id}" title="修改名字"><i class="fas fa-pen"></i></button>
            <button class="delete-intern-btn" data-id="${intern.id}" title="删除实习生"><i class="fas fa-trash"></i></button>
            <i class="fas fa-chevron-right" style="color:#94a3b8;"></i>
          </div>
        </div>
      `).join('');

      listDiv.querySelectorAll('.intern-item').forEach(item => {
        item.addEventListener('click', function(e) {
          if (e.target.closest('.edit-name-btn') || e.target.closest('.delete-intern-btn')) return;
          selectIntern(this.dataset.id, regionId);
        });
      });

      listDiv.querySelectorAll('.edit-name-btn').forEach(btn => {
        btn.addEventListener('click', function(e) { e.stopPropagation(); showEditNameModal(this.dataset.id); });
      });

      listDiv.querySelectorAll('.delete-intern-btn').forEach(btn => {
        btn.addEventListener('click', function(e) {
          e.stopPropagation();
          const internId = this.dataset.id;
          if (confirm('确定要删除该实习生及其所有数据吗？此操作不可恢复。')) {
            interns = interns.filter(i => i.id !== internId);
            delete dailyRecords[internId];
            delete selectedRows[internId];
            delete currentPage[internId];
            delete dataViewMode[internId];
            saveInternsToStorage();
            saveDataToStorage();
            if (selectedInternId === internId) selectedInternId = null;
            renderAllPanels();
            switchRegion(regionId);
          }
        });
      });
    }

    function selectIntern(internId, regionId) {
      selectedInternId = internId;
      if (!currentPage[internId]) currentPage[internId] = 1;
      if (!selectedRows[internId]) selectedRows[internId] = new Set();
      if (!dataViewMode[internId]) dataViewMode[internId] = 'week';
      
      document.querySelectorAll(`#internList-${regionId} .intern-item`).forEach(el => {
        el.classList.remove('selected');
        if (el.dataset.id === internId) el.classList.add('selected');
      });

      // 同步视图标签
      const tabs = document.getElementById(`viewTabs-${regionId}`);
      if (tabs) {
        tabs.querySelectorAll('.view-tab').forEach(t => {
          t.classList.remove('active');
          if (t.dataset.view === dataViewMode[internId]) t.classList.add('active');
        });
      }

      refreshDataDisplay(regionId, internId);
    }

    function renderDataTable(regionId, internId) {
      const container = document.getElementById(`tableContainer-${regionId}`);
      if (!container) return;
      if (!currentPage[internId]) currentPage[internId] = 1;
      if (!selectedRows[internId]) selectedRows[internId] = new Set();

      const paged = getPagedRecords(internId, currentPage[internId]);
      const records = paged.records;
      const allRecords = dailyRecords[internId] || [];
      const selectedSet = selectedRows[internId];

      const allCurrentPageSelected = records.length > 0 && records.every((_, idx) => selectedSet.has((paged.page - 1) * PAGE_SIZE + idx));

      // 获取启用的维度
            if (!weeklyStandards[regionId]) {
        weeklyStandards[regionId] = {
          enabledDimensions: ALL_DIMENSIONS.map(d => d.key),
          targets: {}
        };
      }
      const standardConfig = weeklyStandards[regionId];
      const enabledDims = standardConfig.enabledDimensions || ALL_DIMENSIONS.map(d => d.key);
      const visibleDims = ALL_DIMENSIONS.filter(d => enabledDims.includes(d.key));

      let html = `
        <div class="toolbar">
          <button class="danger" id="batchDeleteBtn-${regionId}" style="padding:8px 16px; font-size:0.85rem;" ${selectedSet.size === 0 ? 'disabled' : ''}>
            <i class="fas fa-trash-alt"></i> 批量删除 (${selectedSet.size})
          </button>
          <span style="font-size:0.8rem; color:#64748b;">共 ${allRecords.length} 条记录</span>
        </div>
        <div class="table-wrapper"><table>
        <thead><tr>
          <th style="width:40px;"><input type="checkbox" id="selectAll-${regionId}" ${allCurrentPageSelected ? 'checked' : ''}></th>
          <th>日期</th>
          ${visibleDims.map(d => `<th>${d.icon} ${d.label}</th>`).join('')}
          <th>操作</th>
        </tr></thead><tbody>`;

      records.forEach((rec, idx) => {
        const globalIdx = (paged.page - 1) * PAGE_SIZE + idx;
        const isChecked = selectedSet.has(globalIdx);
        html += `<tr>
          <td><input type="checkbox" class="row-checkbox" data-idx="${globalIdx}" ${isChecked ? 'checked' : ''}></td>
          <td>${rec.date}</td>
          ${visibleDims.map(d => `<td>${rec[d.key] || 0}${d.key === 'cost' ? '$' : ''}</td>`).join('')}
          <td><button class="secondary" style="padding:4px 10px;" data-delete="${internId}" data-idx="${globalIdx}"><i class="fas fa-trash"></i></button></td>
        </tr>`;
      });

      html += `<tr class="batch-input-row">
        <td></td>
        <td><input type="date" id="batchDate-${regionId}" style="width:120px;"></td>
        ${visibleDims.map(d => `<td><input class="small-input" id="batch-${d.key}-${regionId}" placeholder="${d.label}" style="width:${d.key === 'cost' ? '90px' : '70px'};"></td>`).join('')}
        <td><button id="saveBatchBtn-${regionId}"><i class="fas fa-save"></i> 保存</button></td>
      </tr>`;

      html += `</tbody></table></div>`;

      html += `<div class="pagination">
        <button ${paged.page <= 1 ? 'disabled' : ''} id="prevPage-${regionId}">上一页</button>
        <span class="page-info">第 ${paged.page} / ${paged.totalPages} 页</span>
        <button ${paged.page >= paged.totalPages ? 'disabled' : ''} id="nextPage-${regionId}">下一页</button>
      </div>`;

      container.innerHTML = html;

      const selectAllCheckbox = document.getElementById(`selectAll-${regionId}`);
      if (selectAllCheckbox) {
        selectAllCheckbox.addEventListener('change', function() {
          records.forEach((_, idx) => {
            const globalIdx = (paged.page - 1) * PAGE_SIZE + idx;
            if (this.checked) selectedSet.add(globalIdx);
            else selectedSet.delete(globalIdx);
          });
          renderDataTable(regionId, internId);
        });
      }

      container.querySelectorAll('.row-checkbox').forEach(cb => {
        cb.addEventListener('change', function() {
          const globalIdx = parseInt(this.dataset.idx);
          if (this.checked) selectedSet.add(globalIdx);
          else selectedSet.delete(globalIdx);
          renderDataTable(regionId, internId);
        });
      });

      const batchDeleteBtn = document.getElementById(`batchDeleteBtn-${regionId}`);
      if (batchDeleteBtn) {
        batchDeleteBtn.addEventListener('click', () => {
          if (selectedSet.size === 0) return;
          if (confirm(`确定要删除选中的 ${selectedSet.size} 条记录吗？`)) {
            const sortedIndices = Array.from(selectedSet).sort((a, b) => b - a);
            sortedIndices.forEach(idx => { dailyRecords[internId].splice(idx, 1); });
            selectedRows[internId] = new Set();
            saveDataToStorage();
            const totalPages = Math.ceil(dailyRecords[internId].length / PAGE_SIZE) || 1;
            if (currentPage[internId] > totalPages) currentPage[internId] = totalPages;
            refreshDataDisplay(regionId, internId);
            renderRanking(regionId);
          }
        });
      }

      container.querySelectorAll('[data-delete]').forEach(btn => {
        btn.addEventListener('click', function() {
          const delIntern = this.dataset.delete;
          const idx = parseInt(this.dataset.idx);
          if (confirm('确定要删除这条记录吗？')) {
            dailyRecords[delIntern].splice(idx, 1);
            selectedRows[delIntern].delete(idx);
            const newSet = new Set();
            selectedRows[delIntern].forEach(i => {
              if (i > idx) newSet.add(i - 1);
              else if (i < idx) newSet.add(i);
            });
            selectedRows[delIntern] = newSet;
            saveDataToStorage();
            const totalPages = Math.ceil(dailyRecords[delIntern].length / PAGE_SIZE) || 1;
            if (currentPage[delIntern] > totalPages) currentPage[delIntern] = totalPages;
            refreshDataDisplay(regionId, internId);
            renderRanking(regionId);
          }
        });
      });

      const prevBtn = document.getElementById(`prevPage-${regionId}`);
      const nextBtn = document.getElementById(`nextPage-${regionId}`);
      if (prevBtn) prevBtn.addEventListener('click', () => {
        if (currentPage[internId] > 1) { currentPage[internId]--; renderDataTable(regionId, internId); }
      });
      if (nextBtn) nextBtn.addEventListener('click', () => {
        if (currentPage[internId] < paged.totalPages) { currentPage[internId]++; renderDataTable(regionId, internId); }
      });

      const saveBtn = document.getElementById(`saveBatchBtn-${regionId}`);
      if (saveBtn) saveBtn.addEventListener('click', () => batchAddRecord(regionId, internId));
    }

    function batchAddRecord(regionId, internId) {
      const date = document.getElementById(`batchDate-${regionId}`).value;
      if (!date) { alert('请选择日期'); return; }
      
            if (!weeklyStandards[regionId]) {
        weeklyStandards[regionId] = {
          enabledDimensions: ALL_DIMENSIONS.map(d => d.key),
          targets: {}
        };
      }
      const standardConfig = weeklyStandards[regionId];
      const enabledDims = standardConfig.enabledDimensions || ALL_DIMENSIONS.map(d => d.key);
      
      const record = { date };
      ALL_DIMENSIONS.forEach(dim => {
        if (enabledDims.includes(dim.key)) {
          const el = document.getElementById(`batch-${dim.key}-${regionId}`);
          record[dim.key] = el ? (parseInt(el.value) || 0) : 0;
        } else {
          record[dim.key] = 0;
        }
      });

      dailyRecords[internId].push(record);
      dailyRecords[internId].sort((a, b) => new Date(a.date) - new Date(b.date));
      saveDataToStorage();

      ALL_DIMENSIONS.forEach(dim => {
        const el = document.getElementById(`batch-${dim.key}-${regionId}`);
        if (el) el.value = '';
      });

      currentPage[internId] = Math.ceil(dailyRecords[internId].length / PAGE_SIZE);
      refreshDataDisplay(regionId, internId);
      renderRanking(regionId);
    }

    function renderAnalysis(regionId, internId) {
      const card = document.getElementById(`analysisCard-${regionId}`);
      if (!card) return;

            if (!weeklyStandards[regionId]) {
        weeklyStandards[regionId] = {
          enabledDimensions: ALL_DIMENSIONS.map(d => d.key),
          targets: {}
        };
      }
      const standardConfig = weeklyStandards[regionId];
      const enabledDims = standardConfig.enabledDimensions || ALL_DIMENSIONS.map(d => d.key);
      const targets = standardConfig.targets || {};

      const weekRecords = getWeekRecords(internId);
      const monthRecords = getMonthRecords(internId);
      const allRecords = dailyRecords[internId] || [];

      if (allRecords.length === 0) {
        card.innerHTML = `<p style="color:#64748b;">暂无数据，请先录入日报。</p>`;
        return;
      }

      const weekTotals = {};
      const monthTotals = {};
      ALL_DIMENSIONS.forEach(dim => {
        weekTotals[dim.key] = weekRecords.reduce((s, r) => s + (r[dim.key] || 0), 0);
        monthTotals[dim.key] = monthRecords.reduce((s, r) => s + (r[dim.key] || 0), 0);
      });

      const visibleDims = ALL_DIMENSIONS.filter(d => enabledDims.includes(d.key));
      
      const checks = visibleDims.map(dim => ({
        ...dim,
        weekValue: weekTotals[dim.key],
        monthValue: monthTotals[dim.key],
        target: targets[dim.key] || 0
      }));

      const passCount = checks.filter(c => c.target > 0 && c.weekValue >= c.target).length;
      const totalChecks = checks.filter(c => c.target > 0).length;

      let suggestion = '';
      if (totalChecks === 0) suggestion = '📝 请先设置该地区的周标准维度。';
      else if (passCount === totalChecks) suggestion = '🎉 本周全部达标！表现优秀，继续保持！';
      else if (passCount >= totalChecks * 0.7) suggestion = '👍 大部分指标达标，继续加油！';
      else if (passCount >= totalChecks * 0.4) suggestion = '📈 还有提升空间，重点关注未达标项。';
      else suggestion = '⚠️ 多项指标未达标，需要制定改进计划。';

      card.innerHTML = `
        <h4 style="margin-bottom:12px;"><i class="fas fa-chart-pie"></i> 本周 vs 本月产出对比</h4>
        <div style="display:grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap:10px; font-size:0.85rem;">
          ${checks.map(c => `
            <div style="padding:10px; background:white; border-radius:10px; text-align:center; border:1px solid #e9eef3;">
              <div style="color:#64748b; font-weight:600;">${c.icon} ${c.label}</div>
              <div style="display:flex; justify-content:center; gap:16px; margin-top:6px;">
                <div>
                  <div style="font-size:0.65rem; color:#94a3b8;">本周</div>
                  <div style="font-weight:700; font-size:1.1rem;">${c.weekValue.toLocaleString()}</div>
                </div>
                <div>
                  <div style="font-size:0.65rem; color:#94a3b8;">本月</div>
                  <div style="font-weight:700; font-size:1.1rem;">${c.monthValue.toLocaleString()}</div>
                </div>
              </div>
              ${c.target > 0 ? `
                <div style="margin-top:4px; font-size:0.7rem;">
                  目标：${c.target} | 
                  <span class="${c.weekValue >= c.target ? 'status-pass' : 'status-fail'}">
                    ${c.weekValue >= c.target ? '✓达标' : '✗差' + (c.target - c.weekValue)}
                  </span>
                </div>
              ` : '<div style="margin-top:4px; font-size:0.7rem; color:#94a3b8;">未设目标</div>'}
            </div>
          `).join('')}
        </div>
        ${totalChecks > 0 ? `
          <div style="margin-top:12px; font-weight:600; text-align:center;">
            周达标率：${passCount}/${totalChecks} (${Math.round(passCount/totalChecks*100)}%)
          </div>
        ` : ''}
        <div style="margin-top:14px; background:#eef2ff; padding:12px; border-radius:14px;">
          <i class="fas fa-lightbulb" style="color:#4f46e5;"></i> <strong>改善建议：</strong>${suggestion}
        </div>
      `;
    }

    function renderRanking(regionId) {
      const rankingDiv = document.getElementById(`rankingList-${regionId}`);
      if (!rankingDiv) return;
      const regionInterns = getInternsByRegion(regionId);

      if (regionInterns.length === 0) {
        rankingDiv.innerHTML = '<p style="color:#94a3b8; font-size:0.85rem;">暂无实习生</p>';
        return;
      }

      const rankings = regionInterns.map(intern => {
        const weekRecords = getWeekRecords(intern.id);
        const score = calculateScore(weekRecords);
        return {
          id: intern.id, name: intern.name, score,
          approach: weekRecords.reduce((s,r)=> s+r.approach, 0),
          reply: weekRecords.reduce((s,r)=> s+r.reply, 0),
          host: weekRecords.reduce((s,r)=> s+r.newHost, 0)
        };
      });

      rankings.sort((a, b) => b.score - a.score);

      rankingDiv.innerHTML = rankings.map((r, idx) => {
        let rankClass = idx === 0 ? 'rank-1' : idx === 1 ? 'rank-2' : idx === 2 ? 'rank-3' : 'rank-other';
        return `
          <div class="rank-item">
            <div style="display:flex; align-items:center; gap:10px;">
              <div class="rank-badge ${rankClass}">${idx + 1}</div>
              <div>
                <div style="font-weight:700;">${r.name}</div>
                <div style="font-size:0.75rem; color:#64748b;">搭讪${r.approach} | 回复${r.reply} | 主播${r.host}</div>
              </div>
            </div>
            <div style="font-weight:700; color:#4f46e5;">${r.score}分</div>
          </div>
        `;
      }).join('');
    }

    function switchRegion(regionId) {
      currentRegion = regionId;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelector(`.tab-btn[data-region="${regionId}"]`).classList.add('active');
      document.querySelectorAll('.region-panel').forEach(p => p.classList.remove('active'));
      document.getElementById(`panel-${regionId}`).classList.add('active');
      renderRanking(regionId);
      const regionInterns = getInternsByRegion(regionId);
      if (regionInterns.length > 0) {
        selectedInternId = regionInterns[0].id;
        if (!currentPage[selectedInternId]) currentPage[selectedInternId] = 1;
        if (!selectedRows[selectedInternId]) selectedRows[selectedInternId] = new Set();
        if (!dataViewMode[selectedInternId]) dataViewMode[selectedInternId] = 'week';
        renderInternList(regionId);
        refreshDataDisplay(regionId, selectedInternId);
      } else {
        selectedInternId = null;
        document.getElementById(`tableContainer-${regionId}`).innerHTML = '<p>暂无实习生，请先添加</p>';
        document.getElementById(`summaryCards-${regionId}`).innerHTML = '<p style="color:#94a3b8; padding:20px; text-align:center;">暂无实习生</p>';
        document.getElementById(`analysisCard-${regionId}`).innerHTML = '<p style="color:#64748b;">暂无实习生</p>';
      }
    }

    function showEditNameModal(internId) {
      const intern = interns.find(i => i.id === internId);
      if (!intern) return;

      const existing = document.querySelector('.modal-overlay');
      if (existing) existing.remove();

      const overlay = document.createElement('div');
      overlay.className = 'modal-overlay';
      overlay.innerHTML = `
        <div class="modal-box">
          <h3><i class="fas fa-user-edit"></i> 修改实习生名字</h3>
          <p style="color:#64748b; margin-bottom:12px;">当前名字：<strong>${intern.name}</strong></p>
          <input type="text" id="newNameInput" value="${intern.name}" placeholder="请输入新名字" autocomplete="off">
          <div class="modal-actions">
            <button class="cancel-btn" id="cancelEditBtn">取消</button>
            <button class="confirm-btn" id="confirmEditBtn">确认修改</button>
          </div>
        </div>
      `;
      document.body.appendChild(overlay);

      const inputEl = document.getElementById('newNameInput');
      setTimeout(() => { inputEl.focus(); inputEl.select(); }, 150);

      document.getElementById('cancelEditBtn').addEventListener('click', () => overlay.remove());
      document.getElementById('confirmEditBtn').addEventListener('click', () => {
        const newName = inputEl.value.trim();
        if (!newName) { alert('名字不能为空'); inputEl.focus(); return; }
        intern.name = newName;
        saveInternsToStorage();
        const nameDisplay = document.getElementById(`nameDisplay-${internId}`);
        if (nameDisplay) nameDisplay.textContent = newName;
        overlay.remove();
        const currentPanel = document.querySelector('.region-panel.active');
        if (currentPanel) {
          const regionId = currentPanel.id.replace('panel-', '');
          renderInternList(regionId);
          renderRanking(regionId);
          if (selectedInternId === internId) refreshDataDisplay(regionId, internId);
        }
      });

      overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });
      inputEl.addEventListener('keypress', (e) => { if (e.key === 'Enter') { e.preventDefault(); document.getElementById('confirmEditBtn').click(); } });
    }

    document.getElementById('regionTabs').addEventListener('click', (e) => {
      const btn = e.target.closest('.tab-btn');
      if (!btn) return;
      switchRegion(btn.dataset.region);
    });

    renderAllPanels();
    const firstTw = getInternsByRegion('taiwan')[0];
    if (firstTw) {
      selectedInternId = firstTw.id;
      currentPage[selectedInternId] = 1;
      selectedRows[selectedInternId] = new Set();
      dataViewMode[selectedInternId] = 'week';
      setTimeout(() => {
        renderInternList('taiwan');
        refreshDataDisplay('taiwan', selectedInternId);
        renderRanking('taiwan');
      }, 20);
    }
  })();
</script>
</body>
</html>
