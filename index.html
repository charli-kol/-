<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
  <title>KOL实习生管理系统 · 多地区日报分析</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f5f7fc;
      color: #1e293b;
      padding: 30px 25px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }

    .app-container {
      max-width: 1400px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    /* 顶部导航 */
    .top-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      background: white;
      padding: 18px 30px;
      border-radius: 24px;
      box-shadow: 0 10px 25px -10px rgba(0,0,0,0.04);
    }

    .logo h1 {
      font-size: 1.8rem;
      font-weight: 700;
      background: linear-gradient(135deg, #1e293b, #4f46e5);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .logo span {
      font-size: 0.9rem;
      color: #64748b;
      font-weight: 500;
    }

    /* 地区标签切换 */
    .region-tabs {
      display: flex;
      gap: 10px;
      background: #f1f5f9;
      padding: 6px;
      border-radius: 40px;
    }

    .tab-btn {
      padding: 10px 24px;
      border: none;
      background: transparent;
      border-radius: 30px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      color: #475569;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .tab-btn i {
      font-size: 0.9rem;
    }

    .tab-btn.active {
      background: white;
      color: #4f46e5;
      box-shadow: 0 4px 12px rgba(79,70,229,0.15);
    }

    /* 主内容区：左侧实习生列表，右侧数据表格 */
    .region-panel {
      display: none;
      gap: 24px;
      flex-wrap: wrap;
    }

    .region-panel.active {
      display: flex;
    }

    .intern-sidebar {
      flex: 0 0 280px;
      background: white;
      border-radius: 24px;
      padding: 20px;
      box-shadow: 0 10px 25px -8px rgba(0,0,0,0.04);
      height: fit-content;
    }

    .data-main {
      flex: 1;
      background: white;
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 10px 25px -8px rgba(0,0,0,0.04);
      min-width: 0;
    }

    .intern-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 12px;
      border-radius: 16px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: 0.2s;
      border: 1px solid transparent;
    }

    .intern-item:hover {
      background: #f8fafc;
    }

    .intern-item.selected {
      background: #eef2ff;
      border-color: #4f46e5;
    }

    .intern-name {
      font-weight: 700;
    }

    .add-data-btn {
      background: #4f46e5;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 30px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 16px;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    /* 表格样式 */
    .table-wrapper {
      overflow-x: auto;
      border-radius: 16px;
      border: 1px solid #e9eef3;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
      white-space: nowrap;
    }

    th {
      background: #f8fafc;
      padding: 14px 12px;
      text-align: left;
      font-weight: 600;
      color: #334155;
    }

    td {
      padding: 12px;
      border-bottom: 1px solid #f1f5f9;
    }

    .batch-input-row {
      background: #fdf4ff;
    }

    input, select {
      padding: 8px 12px;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      font-family: inherit;
      width: 100px;
    }

    .small-input {
      width: 80px;
    }

    .analysis-card {
      background: #f9fafb;
      border-radius: 20px;
      padding: 20px;
      margin-top: 24px;
    }

    .flex-row {
      display: flex;
      gap: 15px;
      align-items: center;
      flex-wrap: wrap;
    }

    button {
      background: #4f46e5;
      border: none;
      color: white;
      font-weight: 600;
      padding: 10px 20px;
      border-radius: 30px;
      cursor: pointer;
      transition: 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    button.secondary {
      background: #f1f5f9;
      color: #1e293b;
    }

    @media (max-width: 850px) {
      .region-panel {
        flex-direction: column;
      }
      .intern-sidebar {
        flex: auto;
      }
    }
  </style>
</head>
<body>
<div class="app-container">
  <div class="top-header">
    <div class="logo">
      <h1>📊 KOL实习生管理</h1>
      <span>台湾 · 土耳其 · 西语大区 · 巴西</span>
    </div>
    <div class="region-tabs" id="regionTabs">
      <button class="tab-btn active" data-region="taiwan"><i class="fas fa-flag"></i> 台湾</button>
      <button class="tab-btn" data-region="turkey"><i class="fas fa-flag"></i> 土耳其</button>
      <button class="tab-btn" data-region="spanish"><i class="fas fa-globe"></i> 西语大区</button>
      <button class="tab-btn" data-region="brazil"><i class="fas fa-flag"></i> 巴西</button>
    </div>
  </div>

  <!-- 四个地区面板动态生成 -->
  <div id="regionPanelsContainer"></div>
</div>

<script>
  (function() {
    const REGIONS = [
      { id: 'taiwan', name: '台湾', icon: 'fa-flag' },
      { id: 'turkey', name: '土耳其', icon: 'fa-flag' },
      { id: 'spanish', name: '西语大区', icon: 'fa-globe' },
      { id: 'brazil', name: '巴西', icon: 'fa-flag' }
    ];

    // 实习生基础数据
    const interns = [
      { id: 'tw1', name: '陈雅婷', region: 'taiwan' },
      { id: 'tw2', name: '林俊杰', region: 'taiwan' },
      { id: 'tr1', name: 'Elif Demir', region: 'turkey' },
      { id: 'tr2', name: 'Mehmet Yılmaz', region: 'turkey' },
      { id: 'es1', name: 'Sofía García', region: 'spanish' },
      { id: 'es2', name: 'Carlos Ruiz', region: 'spanish' },
      { id: 'br1', name: 'Ana Silva', region: 'brazil' },
      { id: 'br2', name: 'João Costa', region: 'brazil' }
    ];

    // 日报数据存储 (按实习生id)
    let dailyRecords = {
      'tw1': [],
      'tw2': [],
      'tr1': [],
      'tr2': [],
      'es1': [],
      'es2': [],
      'br1': [],
      'br2': []
    };

    // 初始化示例数据 (部分日期)
    function seedSampleData() {
      const today = new Date().toISOString().split('T')[0];
      const yesterday = new Date(Date.now() - 86400000).toISOString().split('T')[0];
      dailyRecords['tw1'].push({ date: yesterday, approach: 12, reply: 8, newHost: 2, comments: 34, storyPost: 5, video: 2, cost: 150 });
      dailyRecords['tw1'].push({ date: today, approach: 15, reply: 10, newHost: 3, comments: 40, storyPost: 6, video: 3, cost: 200 });
      dailyRecords['tr1'].push({ date: yesterday, approach: 20, reply: 14, newHost: 4, comments: 55, storyPost: 8, video: 4, cost: 320 });
      dailyRecords['es1'].push({ date: today, approach: 18, reply: 12, newHost: 5, comments: 48, storyPost: 7, video: 3, cost: 280 });
      dailyRecords['br1'].push({ date: yesterday, approach: 22, reply: 16, newHost: 6, comments: 62, storyPost: 10, video: 5, cost: 400 });
    }
    seedSampleData();

    let currentRegion = 'taiwan';
    let selectedInternId = null;

    // 获取地区实习生
    function getInternsByRegion(regionId) {
      return interns.filter(i => i.region === regionId);
    }

    // 渲染所有地区面板
    function renderAllPanels() {
      const container = document.getElementById('regionPanelsContainer');
      container.innerHTML = '';
      REGIONS.forEach(region => {
        const panel = document.createElement('div');
        panel.className = `region-panel ${region.id === currentRegion ? 'active' : ''}`;
        panel.id = `panel-${region.id}`;
        panel.innerHTML = `
          <div class="intern-sidebar">
            <h3 style="margin-bottom:16px;"><i class="fas ${region.icon}"></i> ${region.name}实习生</h3>
            <div id="internList-${region.id}"></div>
            <button class="add-data-btn" id="batchAddBtn-${region.id}"><i class="fas fa-plus-circle"></i> 批次录入数据</button>
          </div>
          <div class="data-main" id="dataMain-${region.id}">
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <h3 style="font-weight:600;">📋 日报数据表</h3>
              <span style="color:#64748b; font-size:0.85rem;">维度：搭讪/回复/新增主播/评论/Story·Post/视频/花费</span>
            </div>
            <div id="tableContainer-${region.id}" style="margin-top:16px;"></div>
            <div class="analysis-card" id="analysisCard-${region.id}">
              <p style="color:#64748b;">👈 请选择左侧实习生查看数据与产出分析</p>
            </div>
          </div>
        `;
        container.appendChild(panel);
        renderInternList(region.id);
      });
    }

    // 渲染某地区实习生列表
    function renderInternList(regionId) {
      const listDiv = document.getElementById(`internList-${regionId}`);
      if (!listDiv) return;
      const regionInterns = getInternsByRegion(regionId);
      listDiv.innerHTML = regionInterns.map(intern => `
        <div class="intern-item ${selectedInternId === intern.id ? 'selected' : ''}" data-id="${intern.id}">
          <span class="intern-name">${intern.name}</span>
          <i class="fas fa-chevron-right" style="color:#94a3b8;"></i>
        </div>
      `).join('');

      // 绑定点击事件
      listDiv.querySelectorAll('.intern-item').forEach(item => {
        item.addEventListener('click', function() {
          const id = this.dataset.id;
          selectIntern(id, regionId);
        });
      });
    }

    // 选择实习生
    function selectIntern(internId, regionId) {
      selectedInternId = internId;
      // 更新选中样式
      document.querySelectorAll(`#internList-${regionId} .intern-item`).forEach(el => {
        el.classList.remove('selected');
        if (el.dataset.id === internId) el.classList.add('selected');
      });
      renderDataTable(regionId, internId);
      renderAnalysis(regionId, internId);
    }

    // 渲染数据表格
    function renderDataTable(regionId, internId) {
      const container = document.getElementById(`tableContainer-${regionId}`);
      if (!container) return;
      const records = dailyRecords[internId] || [];
      
      let html = `<div class="table-wrapper"><table>
        <thead><tr>
          <th>日期</th><th>搭讪人数</th><th>回复人数</th><th>新增主播</th><th>评论数</th><th>Story/Post</th><th>视频数</th><th>花费</th><th></th>
        </tr></thead><tbody>`;
      
      records.forEach((rec, idx) => {
        html += `<tr>
          <td>${rec.date}</td>
          <td>${rec.approach}</td><td>${rec.reply}</td><td>${rec.newHost}</td>
          <td>${rec.comments}</td><td>${rec.storyPost}</td><td>${rec.video}</td><td>$${rec.cost}</td>
          <td><button class="secondary" style="padding:4px 10px;" data-delete="${internId}" data-idx="${idx}"><i class="fas fa-trash"></i></button></td>
        </tr>`;
      });

      // 批次录入行
      html += `<tr class="batch-input-row" id="batchRow-${regionId}">
        <td><input type="date" id="batchDate-${regionId}" style="width:120px;"></td>
        <td><input class="small-input" id="batchApproach-${regionId}" placeholder="搭讪"></td>
        <td><input class="small-input" id="batchReply-${regionId}" placeholder="回复"></td>
        <td><input class="small-input" id="batchHost-${regionId}" placeholder="主播"></td>
        <td><input class="small-input" id="batchComments-${regionId}" placeholder="评论"></td>
        <td><input class="small-input" id="batchStory-${regionId}" placeholder="Story"></td>
        <td><input class="small-input" id="batchVideo-${regionId}" placeholder="视频"></td>
        <td><input class="small-input" id="batchCost-${regionId}" placeholder="花费"></td>
        <td><button id="saveBatchBtn-${regionId}"><i class="fas fa-save"></i></button></td>
      </tr>`;
      
      html += `</tbody></table></div>`;
      container.innerHTML = html;

      // 绑定保存按钮
      const saveBtn = document.getElementById(`saveBatchBtn-${regionId}`);
      if (saveBtn) {
        saveBtn.addEventListener('click', () => batchAddRecord(regionId, internId));
      }
      // 绑定删除按钮
      container.querySelectorAll('[data-delete]').forEach(btn => {
        btn.addEventListener('click', function(e) {
          const delIntern = this.dataset.delete;
          const idx = parseInt(this.dataset.idx);
          dailyRecords[delIntern].splice(idx, 1);
          renderDataTable(regionId, internId);
          renderAnalysis(regionId, internId);
        });
      });
    }

    // 批次添加记录
    function batchAddRecord(regionId, internId) {
      const date = document.getElementById(`batchDate-${regionId}`).value;
      if (!date) { alert('请选择日期'); return; }
      const approach = parseInt(document.getElementById(`batchApproach-${regionId}`).value) || 0;
      const reply = parseInt(document.getElementById(`batchReply-${regionId}`).value) || 0;
      const newHost = parseInt(document.getElementById(`batchHost-${regionId}`).value) || 0;
      const comments = parseInt(document.getElementById(`batchComments-${regionId}`).value) || 0;
      const storyPost = parseInt(document.getElementById(`batchStory-${regionId}`).value) || 0;
      const video = parseInt(document.getElementById(`batchVideo-${regionId}`).value) || 0;
      const cost = parseInt(document.getElementById(`batchCost-${regionId}`).value) || 0;

      dailyRecords[internId].push({ date, approach, reply, newHost, comments, storyPost, video, cost });
      // 清空输入
      ['batchApproach','batchReply','batchHost','batchComments','batchStory','batchVideo','batchCost'].forEach(id => {
        const el = document.getElementById(`${id}-${regionId}`);
        if (el) el.value = '';
      });
      renderDataTable(regionId, internId);
      renderAnalysis(regionId, internId);
    }

    // 产出分析与改善建议
    function renderAnalysis(regionId, internId) {
      const card = document.getElementById(`analysisCard-${regionId}`);
      if (!card) return;
      const records = dailyRecords[internId] || [];
      if (records.length === 0) {
        card.innerHTML = `<p style="color:#64748b;">暂无数据，请先录入日报。</p>`;
        return;
      }
      const totalApproach = records.reduce((s,r)=> s+r.approach, 0);
      const totalReply = records.reduce((s,r)=> s+r.reply, 0);
      const totalHost = records.reduce((s,r)=> s+r.newHost, 0);
      const totalComments = records.reduce((s,r)=> s+r.comments, 0);
      const totalStory = records.reduce((s,r)=> s+r.storyPost, 0);
      const totalVideo = records.reduce((s,r)=> s+r.video, 0);
      const totalCost = records.reduce((s,r)=> s+r.cost, 0);
      const days = records.length;
      
      let suggestion = '';
      if (totalApproach / days > 15 && totalReply / days > 10) suggestion = '表现优秀，可尝试拓展高价值KOL。';
      else if (totalApproach / days > 8) suggestion = '稳定增长，建议优化回复话术提高转化。';
      else suggestion = '需增加搭讪数量，并关注内容创意。';

      card.innerHTML = `
        <h4 style="margin-bottom:12px;"><i class="fas fa-chart-pie"></i> 周/月度产出概览</h4>
        <div style="display:flex; gap:24px; flex-wrap:wrap;">
          <div><strong>总搭讪：</strong>${totalApproach}</div><div><strong>回复：</strong>${totalReply}</div>
          <div><strong>新增主播：</strong>${totalHost}</div><div><strong>评论：</strong>${totalComments}</div>
          <div><strong>Story/Post：</strong>${totalStory}</div><div><strong>视频：</strong>${totalVideo}</div>
          <div><strong>总花费：</strong>$${totalCost}</div>
        </div>
        <div style="margin-top:14px; background:#eef2ff; padding:12px; border-radius:14px;">
          <i class="fas fa-lightbulb" style="color:#4f46e5;"></i> <strong>改善建议：</strong>${suggestion}
        </div>
      `;
    }

    // 切换地区标签
    function switchRegion(regionId) {
      currentRegion = regionId;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelector(`.tab-btn[data-region="${regionId}"]`).classList.add('active');
      document.querySelectorAll('.region-panel').forEach(p => p.classList.remove('active'));
      document.getElementById(`panel-${regionId}`).classList.add('active');
      // 重置选中实习生 (默认第一个)
      const regionInterns = getInternsByRegion(regionId);
      if (regionInterns.length > 0) {
        selectedInternId = regionInterns[0].id;
        renderInternList(regionId);
        renderDataTable(regionId, selectedInternId);
        renderAnalysis(regionId, selectedInternId);
      } else {
        selectedInternId = null;
        document.getElementById(`tableContainer-${regionId}`).innerHTML = '<p>暂无实习生</p>';
        document.getElementById(`analysisCard-${regionId}`).innerHTML = '';
      }
    }

    // 事件绑定
    document.getElementById('regionTabs').addEventListener('click', (e) => {
      const btn = e.target.closest('.tab-btn');
      if (!btn) return;
      switchRegion(btn.dataset.region);
    });

    // 初始化
    renderAllPanels();
    // 默认选中第一个实习生
    const firstTw = getInternsByRegion('taiwan')[0];
    if (firstTw) {
      selectedInternId = firstTw.id;
      setTimeout(() => {
        renderInternList('taiwan');
        renderDataTable('taiwan', selectedInternId);
        renderAnalysis('taiwan', selectedInternId);
      }, 20);
    }
  })();
</script>
</body>
</html>
