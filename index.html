<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
  <title>KOL实习生管理系统 · 多地区日报分析</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f5f7fc;
      color: #1e293b;
      padding: 30px 25px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }

    .app-container {
      max-width: 1400px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    .top-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      background: white;
      padding: 18px 30px;
      border-radius: 24px;
      box-shadow: 0 10px 25px -10px rgba(0,0,0,0.04);
    }

    .logo h1 {
      font-size: 1.8rem;
      font-weight: 700;
      background: linear-gradient(135deg, #1e293b, #4f46e5);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .logo span {
      font-size: 0.9rem;
      color: #64748b;
      font-weight: 500;
    }

    .region-tabs {
      display: flex;
      gap: 10px;
      background: #f1f5f9;
      padding: 6px;
      border-radius: 40px;
    }

    .tab-btn {
      padding: 10px 24px;
      border: none;
      background: transparent;
      border-radius: 30px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      color: #475569;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .tab-btn i {
      font-size: 0.9rem;
    }

    .tab-btn.active {
      background: white;
      color: #4f46e5;
      box-shadow: 0 4px 12px rgba(79,70,229,0.15);
    }

    .region-panel {
      display: none;
      gap: 24px;
      flex-wrap: wrap;
    }

    .region-panel.active {
      display: flex;
    }

    .intern-sidebar {
      flex: 0 0 300px;
      background: white;
      border-radius: 24px;
      padding: 20px;
      box-shadow: 0 10px 25px -8px rgba(0,0,0,0.04);
      height: fit-content;
    }

    .data-main {
      flex: 1;
      background: white;
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 10px 25px -8px rgba(0,0,0,0.04);
      min-width: 0;
    }

    .intern-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 12px;
      border-radius: 16px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: 0.2s;
      border: 1px solid transparent;
    }

    .intern-item:hover {
      background: #f8fafc;
    }

    .intern-item.selected {
      background: #eef2ff;
      border-color: #4f46e5;
    }

    .intern-name {
      font-weight: 700;
    }

    .add-intern-btn {
      background: #10b981;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 30px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 12px;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .standard-btn {
      background: #f59e0b;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 30px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 0.85rem;
    }

    .table-wrapper {
      overflow-x: auto;
      border-radius: 16px;
      border: 1px solid #e9eef3;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
      white-space: nowrap;
    }

    th {
      background: #f8fafc;
      padding: 14px 12px;
      text-align: left;
      font-weight: 600;
      color: #334155;
    }

    td {
      padding: 12px;
      border-bottom: 1px solid #f1f5f9;
    }

    .batch-input-row {
      background: #fdf4ff;
    }

    input, select {
      padding: 8px 12px;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      font-family: inherit;
      width: 100px;
    }

    .small-input {
      width: 80px;
    }

    .analysis-card {
      background: #f9fafb;
      border-radius: 20px;
      padding: 20px;
      margin-top: 24px;
    }

    .ranking-card {
      background: #fefce8;
      border-radius: 20px;
      padding: 20px;
      margin-top: 16px;
    }

    .rank-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      border-radius: 12px;
      margin-bottom: 6px;
      background: white;
    }

    .rank-badge {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.85rem;
      color: white;
    }

    .rank-1 { background: #f59e0b; }
    .rank-2 { background: #94a3b8; }
    .rank-3 { background: #b45309; }
    .rank-other { background: #cbd5e1; color: #475569; }

    .status-pass { color: #10b981; font-weight: 700; }
    .status-fail { color: #ef4444; font-weight: 700; }

    button {
      background: #4f46e5;
      border: none;
      color: white;
      font-weight: 600;
      padding: 10px 20px;
      border-radius: 30px;
      cursor: pointer;
      transition: 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    button.secondary {
      background: #f1f5f9;
      color: #1e293b;
    }

    button.danger {
      background: #ef4444;
      color: white;
    }

    .edit-name-btn {
      background: none;
      border: none;
      color: #64748b;
      cursor: pointer;
      padding: 4px 6px;
      font-size: 0.85rem;
    }

    .edit-name-btn:hover {
      color: #4f46e5;
    }

    .delete-intern-btn {
      background: none;
      border: none;
      color: #ef4444;
      cursor: pointer;
      padding: 4px 6px;
      font-size: 0.85rem;
    }

    .delete-intern-btn:hover {
      color: #dc2626;
    }

    /* 文件上传区域 */
    .upload-area {
      border: 2px dashed #cbd5e1;
      border-radius: 16px;
      padding: 30px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      background: #fafbfc;
      margin-top: 16px;
    }

    .upload-area:hover {
      border-color: #4f46e5;
      background: #f5f3ff;
    }

    .upload-area i {
      font-size: 2.5rem;
      color: #4f46e5;
      margin-bottom: 10px;
    }

    .upload-area p {
      color: #64748b;
      margin: 5px 0;
    }

    .upload-area .file-types {
      font-size: 0.8rem;
      color: #94a3b8;
    }

    /* 映射预览表 */
    .mapping-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
      margin-top: 16px;
    }

    .mapping-table th, .mapping-table td {
      padding: 10px 14px;
      border: 1px solid #e2e8f0;
      text-align: left;
    }

    .mapping-table th {
      background: #f8fafc;
      font-weight: 600;
    }

    .mapping-table select {
      width: 100%;
      padding: 6px 10px;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
    }

    .preview-scroll {
      max-height: 200px;
      overflow-y: auto;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      margin-top: 12px;
    }

    .tag {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 600;
      margin: 2px;
    }

    .tag-success { background: #d1fae5; color: #065f46; }
    .tag-warning { background: #fef3c7; color: #92400e; }
    .tag-info { background: #dbeafe; color: #1e40af; }

    /* 弹窗 */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      backdrop-filter: blur(2px);
    }

    .modal-box {
      background: white;
      border-radius: 20px;
      padding: 28px 30px;
      width: 450px;
      max-width: 90vw;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.25);
      position: relative;
      animation: modalFadeIn 0.2s ease;
      max-height: 80vh;
      overflow-y: auto;
    }

    @keyframes modalFadeIn {
      from {
        opacity: 0;
        transform: scale(0.95) translateY(-10px);
      }
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .modal-box h3 {
      margin-bottom: 16px;
      font-size: 1.2rem;
      color: #1e293b;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .modal-box label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
      color: #475569;
      font-size: 0.9rem;
    }

    .modal-box input, .modal-box select {
      width: 100%;
      padding: 10px 14px;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      font-size: 0.95rem;
      margin-bottom: 14px;
      outline: none;
      box-sizing: border-box;
    }

    .modal-box input:focus, .modal-box select:focus {
      border-color: #4f46e5;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 8px;
    }

    .modal-actions button {
      padding: 10px 24px;
      border-radius: 25px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      font-size: 0.9rem;
    }

    .modal-actions .cancel-btn {
      background: #f1f5f9;
      color: #475569;
    }

    .modal-actions .confirm-btn {
      background: #4f46e5;
      color: white;
    }

    .standard-row {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 10px;
    }

    .standard-row label {
      min-width: 100px;
      margin-bottom: 0;
    }

    .standard-row input {
      width: 100px;
      margin-bottom: 0;
    }

    @media (max-width: 850px) {
      .region-panel {
        flex-direction: column;
      }
      .intern-sidebar {
        flex: auto;
      }
    }
  </style>
</head>
<body>
<div class="app-container">
  <div class="top-header">
    <div class="logo">
      <h1>📊 KOL实习生管理</h1>
      <span>台湾 · 土耳其 · 西语大区 · 巴西</span>
    </div>
    <div class="region-tabs" id="regionTabs">
      <button class="tab-btn active" data-region="taiwan"><i class="fas fa-flag"></i> 台湾</button>
      <button class="tab-btn" data-region="turkey"><i class="fas fa-flag"></i> 土耳其</button>
      <button class="tab-btn" data-region="spanish"><i class="fas fa-globe"></i> 西语大区</button>
      <button class="tab-btn" data-region="brazil"><i class="fas fa-flag"></i> 巴西</button>
    </div>
  </div>

  <div id="regionPanelsContainer"></div>
</div>

<script>
  (function() {
    const REGIONS = [
      { id: 'taiwan', name: '台湾', icon: 'fa-flag' },
      { id: 'turkey', name: '土耳其', icon: 'fa-flag' },
      { id: 'spanish', name: '西语大区', icon: 'fa-globe' },
      { id: 'brazil', name: '巴西', icon: 'fa-flag' }
    ];

    // 实习生基础数据
    let interns = [];

    function loadInternsFromStorage() {
      const saved = localStorage.getItem('kolInterns');
      if (saved) {
        try {
          interns = JSON.parse(saved);
        } catch (e) {
          initDefaultInterns();
        }
      } else {
        initDefaultInterns();
        saveInternsToStorage();
      }
    }

    function initDefaultInterns() {
      interns = [
        { id: 'tw1', name: '陈雅婷', region: 'taiwan' },
        { id: 'tw2', name: '林俊杰', region: 'taiwan' },
        { id: 'tr1', name: 'Elif Demir', region: 'turkey' },
        { id: 'tr2', name: 'Mehmet Yılmaz', region: 'turkey' },
        { id: 'es1', name: 'Sofía García', region: 'spanish' },
        { id: 'es2', name: 'Carlos Ruiz', region: 'spanish' },
        { id: 'br1', name: 'Ana Silva', region: 'brazil' },
        { id: 'br2', name: 'João Costa', region: 'brazil' }
      ];
    }

    function saveInternsToStorage() {
      localStorage.setItem('kolInterns', JSON.stringify(interns));
    }

    function generateInternId(regionId) {
      const regionInterns = interns.filter(i => i.region === regionId);
      const prefix = regionId.substring(0, 2);
      let maxNum = 0;
      regionInterns.forEach(intern => {
        const match = intern.id.match(/\d+$/);
        if (match) {
          const num = parseInt(match[0]);
          if (num > maxNum) maxNum = num;
        }
      });
      return `${prefix}${maxNum + 1}`;
    }

    // 日报数据存储
    let dailyRecords = {};

    function loadDataFromStorage() {
      const saved = localStorage.getItem('kolDailyRecords');
      if (saved) {
        try {
          dailyRecords = JSON.parse(saved);
        } catch (e) {
          initEmptyRecords();
        }
      } else {
        initEmptyRecords();
        seedSampleData();
        saveDataToStorage();
      }
    }

    function initEmptyRecords() {
      dailyRecords = {};
      interns.forEach(intern => {
        dailyRecords[intern.id] = [];
      });
    }

    function saveDataToStorage() {
      localStorage.setItem('kolDailyRecords', JSON.stringify(dailyRecords));
    }

    function seedSampleData() {
      const today = new Date().toISOString().split('T')[0];
      const yesterday = new Date(Date.now() - 86400000).toISOString().split('T')[0];
      if (dailyRecords['tw1']) dailyRecords['tw1'].push({ date: yesterday, approach: 12, reply: 8, newHost: 2, comments: 34, storyPost: 5, video: 2, cost: 150 });
      if (dailyRecords['tw1']) dailyRecords['tw1'].push({ date: today, approach: 15, reply: 10, newHost: 3, comments: 40, storyPost: 6, video: 3, cost: 200 });
      if (dailyRecords['tr1']) dailyRecords['tr1'].push({ date: yesterday, approach: 20, reply: 14, newHost: 4, comments: 55, storyPost: 8, video: 4, cost: 320 });
      if (dailyRecords['es1']) dailyRecords['es1'].push({ date: today, approach: 18, reply: 12, newHost: 5, comments: 48, storyPost: 7, video: 3, cost: 280 });
      if (dailyRecords['br1']) dailyRecords['br1'].push({ date: yesterday, approach: 22, reply: 16, newHost: 6, comments: 62, storyPost: 10, video: 5, cost: 400 });
    }

    // 周标准存储
    let weeklyStandards = {};

    function loadStandardsFromStorage() {
      const saved = localStorage.getItem('kolWeeklyStandards');
      if (saved) {
        try {
          weeklyStandards = JSON.parse(saved);
        } catch (e) {
          initDefaultStandards();
        }
      } else {
        initDefaultStandards();
        saveStandardsToStorage();
      }
    }

    function initDefaultStandards() {
      weeklyStandards = {
        taiwan: { approach: 50, reply: 30, newHost: 8, comments: 100, storyPost: 20, video: 8, cost: 500 },
        turkey: { approach: 60, reply: 35, newHost: 10, comments: 120, storyPost: 25, video: 10, cost: 600 },
        spanish: { approach: 55, reply: 32, newHost: 9, comments: 110, storyPost: 22, video: 9, cost: 550 },
        brazil: { approach: 65, reply: 40, newHost: 12, comments: 140, storyPost: 28, video: 12, cost: 700 }
      };
    }

    function saveStandardsToStorage() {
      localStorage.setItem('kolWeeklyStandards', JSON.stringify(weeklyStandards));
    }

    // 初始化
    loadInternsFromStorage();
    loadDataFromStorage();
    loadStandardsFromStorage();

    let currentRegion = 'taiwan';
    let selectedInternId = null;

    function getInternsByRegion(regionId) {
      return interns.filter(i => i.region === regionId);
    }

    function getRegionName(regionId) {
      const region = REGIONS.find(r => r.id === regionId);
      return region ? region.name : regionId;
    }

    // 获取当前周的开始日期（周一）
    function getWeekStart() {
      const now = new Date();
      const day = now.getDay();
      const diff = now.getDate() - day + (day === 0 ? -6 : 1);
      const monday = new Date(now.setDate(diff));
      return monday.toISOString().split('T')[0];
    }

    // 获取本周数据
    function getWeekRecords(internId) {
      const weekStart = getWeekStart();
      const records = dailyRecords[internId] || [];
      return records.filter(r => r.date >= weekStart);
    }

    // 计算总分（用于排名）
    function calculateScore(records) {
      return records.reduce((s, r) => {
        return s + r.approach + r.reply + r.newHost * 3 + r.comments + r.storyPost * 2 + r.video * 3;
      }, 0);
    }

    // 渲染所有地区面板
    function renderAllPanels() {
      const container = document.getElementById('regionPanelsContainer');
      container.innerHTML = '';
      REGIONS.forEach(region => {
        const panel = document.createElement('div');
        panel.className = `region-panel ${region.id === currentRegion ? 'active' : ''}`;
        panel.id = `panel-${region.id}`;
        panel.innerHTML = `
          <div class="intern-sidebar">
            <h3 style="margin-bottom:16px;"><i class="fas ${region.icon}"></i> ${region.name}实习生</h3>
            <div id="internList-${region.id}"></div>
            <button class="add-intern-btn" id="addInternBtn-${region.id}"><i class="fas fa-user-plus"></i> 新增实习生</button>
            <button class="standard-btn" id="standardBtn-${region.id}"><i class="fas fa-bullseye"></i> 设置周标准</button>
            <div class="ranking-card" id="rankingCard-${region.id}" style="margin-top:16px;">
              <h4 style="margin-bottom:10px;"><i class="fas fa-trophy"></i> 本周排名</h4>
              <div id="rankingList-${region.id}"></div>
            </div>
          </div>
          <div class="data-main" id="dataMain-${region.id}">
            <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;">
              <h3 style="font-weight:600;">📋 日报数据表</h3>
              <div style="display:flex; gap:8px; align-items:center;">
                <span style="color:#64748b; font-size:0.85rem;">维度：搭讪/回复/新增主播/评论/Story·Post/视频/花费</span>
                <button id="batchUploadBtn-${region.id}" style="background:#10b981; padding:8px 16px; font-size:0.85rem;">
                  <i class="fas fa-file-upload"></i> 批量上传
                </button>
              </div>
            </div>
            <div id="tableContainer-${region.id}" style="margin-top:16px;"></div>
            <div class="analysis-card" id="analysisCard-${region.id}">
              <p style="color:#64748b;">👈 请选择左侧实习生查看数据与产出分析</p>
            </div>
          </div>
        `;
        container.appendChild(panel);
        renderInternList(region.id);
        renderRanking(region.id);
        bindRegionButtons(region.id);
      });
    }

    // 绑定地区按钮
    function bindRegionButtons(regionId) {
      const addBtn = document.getElementById(`addInternBtn-${regionId}`);
      const standardBtn = document.getElementById(`standardBtn-${regionId}`);
      const uploadBtn = document.getElementById(`batchUploadBtn-${regionId}`);

      if (addBtn) {
        addBtn.addEventListener('click', () => showAddInternModal(regionId));
      }
      if (standardBtn) {
        standardBtn.addEventListener('click', () => showStandardModal(regionId));
      }
      if (uploadBtn) {
        uploadBtn.addEventListener('click', () => showUploadModal(regionId));
      }
    }

    // 显示新增实习生弹窗
    function showAddInternModal(regionId) {
      const existing = document.querySelector('.modal-overlay');
      if (existing) existing.remove();

      const overlay = document.createElement('div');
      overlay.className = 'modal-overlay';
      overlay.innerHTML = `
        <div class="modal-box">
          <h3><i class="fas fa-user-plus"></i> 新增实习生</h3>
          <label>实习生名字</label>
          <input type="text" id="newInternName" placeholder="请输入名字" autocomplete="off">
          <label>所属地区</label>
          <select id="newInternRegion">
            ${REGIONS.map(r => `<option value="${r.id}" ${r.id === regionId ? 'selected' : ''}>${r.name}</option>`).join('')}
          </select>
          <div class="modal-actions">
            <button class="cancel-btn" id="cancelAddBtn">取消</button>
            <button class="confirm-btn" id="confirmAddBtn">确认添加</button>
          </div>
        </div>
      `;
      document.body.appendChild(overlay);

      document.getElementById('cancelAddBtn').addEventListener('click', () => overlay.remove());
      document.getElementById('confirmAddBtn').addEventListener('click', () => {
        const name = document.getElementById('newInternName').value.trim();
        const region = document.getElementById('newInternRegion').value;
        if (!name) {
          alert('请输入名字');
          return;
        }
        const newId = generateInternId(region);
        interns.push({ id: newId, name: name, region: region });
        dailyRecords[newId] = [];
        saveInternsToStorage();
        saveDataToStorage();
        overlay.remove();
        renderAllPanels();
        switchRegion(region);
      });

      overlay.addEventListener('click', (e) => {
        if (e.target === overlay) overlay.remove();
      });
    }

              <p style="font-size:0.8rem; color:#64748b; margin-bottom:10px;">
                系统已自动匹配，请确认或手动调整。未映射的列将被忽略。

            </div>

            </div>
          </div>
        </div>
      `;
      document.body.appendChild(overlay);

      let parsedData = [];
      let fileHeaders = [];
      let columnMapping = {};

      const dropZone = document.getElementById(`uploadDropZone-${regionId}`);
      const fileInput = document.getElementById(`fileInput-${regionId}`);

      dropZone.addEventListener('click', () => fileInput.click());

      dropZone.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropZone.style.borderColor = '#4f46e5';
        dropZone.style.background = '#f5f3ff';
      });

      dropZone.addEventListener('dragleave', () => {
        dropZone.style.borderColor = '#cbd5e1';
        dropZone.style.background = '#fafbfc';
      });

      dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.style.borderColor = '#cbd5e1';
        dropZone.style.background = '#fafbfc';
        const file = e.dataTransfer.files[0];
        if (file) processFile(file);
      });

      fileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) processFile(file);
      });

      function processFile(file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const text = e.target.result;
          parseCSV(text);
        };
        reader.readAsText(file);
      }

      function parseCSV(text) {
        const lines = text.split('\n').filter(line => line.trim() !== '');
        if (lines.length < 2) {
          alert('文件内容不足，至少需要表头和一行数据');
          return;
        }

        fileHeaders = parseCSVLine(lines[0]);
        
        parsedData = [];
        for (let i = 1; i < lines.length; i++) {
          const values = parseCSVLine(lines[i]);
          if (values.length > 0 && values.some(v => v.trim() !== '')) {
            const row = {};
            fileHeaders.forEach((header, idx) => {
              row[header] = values[idx] || '';
            });
            parsedData.push(row);
          }
        }

        if (parsedData.length === 0) {
          alert('未解析到有效数据行');
          return;
        }

        autoMapColumns();
        showPreview();
      }

      function parseCSVLine(line) {
        const result = [];
        let current = '';
        let inQuotes = false;
        
        for (let i = 0; i < line.length; i++) {
          const char = line[i];
          if (char === '"') {
            inQuotes = !inQuotes;
          } else if (char === ',' && !inQuotes) {
            result.push(current.trim());
            current = '';
          } else {
            current += char;
          }
        }
        result.push(current.trim());
        return result;
      }

      function autoMapColumns() {
        const targetFields = {
          'date': ['日期', 'date', '时间', '日报日期', 'day'],
          'approach': ['搭讪', '搭讪人数', 'approach', '搭讪数', 'reach'],
          'reply': ['回复', '回复人数', 'reply', '回复数', 'response'],
          'newHost': ['新增主播', '主播', 'host', 'newHost', '新增', '主播数'],
          'comments': ['评论', '评论数', 'comments', 'comment'],
          'storyPost': ['story', 'post', '故事', 'story/post', 'storypost', '内容'],
          'video': ['视频', '视频数', 'video', 'videos'],
          'cost': ['花费', '费用', 'cost', '金额', '预算', 'spend']
        };

        columnMapping = {};
        fileHeaders.forEach(header => {
          const headerLower = header.toLowerCase().replace(/[\s\/\-_]/g, '');
          
          for (const [field, keywords] of Object.entries(targetFields)) {
            if (columnMapping[field]) continue;
            for (const keyword of keywords) {
              const kwLower = keyword.toLowerCase().replace(/[\s\/\-_]/g, '');
              if (headerLower.includes(kwLower) || kwLower.includes(headerLower)) {
                columnMapping[field] = header;
                break;
              }
            }
          }
        });

        if (!columnMapping['date']) {
          columnMapping['date'] = null;
        }
      }

      function showPreview() {
        const previewDiv = document.getElementById(`uploadPreview-${regionId}`);
        const uploadArea = document.getElementById(`uploadDropZone-${regionId}`);
        
        uploadArea.style.display = 'none';
        previewDiv.style.display = 'block';

        document.getElementById(`rowCount-${regionId}`).textContent = `共 ${parsedData.length} 行数据`;

        const previewTable = document.getElementById(`previewTable-${regionId}`);
        const previewRows = parsedData.slice(0, 5);
        
        let tableHTML = '<table class="mapping-table"><thead><tr>';
        fileHeaders.forEach(h => tableHTML += `<th>${h}</th>`);
        tableHTML += '</tr></thead><tbody>';
        
        previewRows.forEach(row => {
          tableHTML += '<tr>';
          fileHeaders.forEach(h => tableHTML += `<td>${row[h] || ''}</td>`);
          tableHTML += '</tr>';
        });
        
        if (parsedData.length > 5) {
          tableHTML += `<tr><td colspan="${fileHeaders.length}" style="text-align:center; color:#64748b;">... 还有 ${parsedData.length - 5} 行数据</td></tr>`;
        }
        
        tableHTML += '</tbody></table>';
        previewTable.innerHTML = tableHTML;

        const mappingDiv = document.getElementById(`mappingConfig-${regionId}`);
        const dimensions = [
          { key: 'date', label: '📅 日期' },
          { key: 'approach', label: '💬 搭讪人数' },
          { key: 'reply', label: '↩️ 回复人数' },
          { key: 'newHost', label: '🎤 新增主播' },
          { key: 'comments', label: '💭 评论数' },
          { key: 'storyPost', label: '📱 Story/Post数' },
          { key: 'video', label: '🎬 视频数' },
          { key: 'cost', label: '💰 花费' }
        ];

        mappingDiv.innerHTML = dimensions.map(dim => `
          <div style="display:flex; align-items:center; gap:12px; margin-bottom:8px;">
            <label style="min-width:120px; font-weight:500;">${dim.label}：</label>
            <select id="map-${dim.key}-${regionId}" style="flex:1;">
              <option value="">-- 不映射 --</option>
              ${fileHeaders.map(h => `
                <option value="${h}" ${columnMapping[dim.key] === h ? 'selected' : ''}>${h}</option>
              `).join('')}
            </select>
            ${columnMapping[dim.key] ? '<span class="tag tag-success">已匹配</span>' : '<span class="tag tag-warning">待选择</span>'}
          </div>
        `).join('');
      }

      document.getElementById('cancelUploadBtn').addEventListener('click', () => overlay.remove());

      document.getElementById('confirmUploadBtn').addEventListener('click', () => {
        const finalMapping = {};
        const dimensions = ['date', 'approach', 'reply', 'newHost', 'comments', 'storyPost', 'video', 'cost'];
        
        dimensions.forEach(dim => {
          const select = document.getElementById(`map-${dim}-${regionId}`);
          if (select && select.value) {
            finalMapping[dim] = select.value;
          }
        });

        const defaultDate = document.getElementById(`defaultDate-${regionId}`).value;

        if (!finalMapping['approach'] && !finalMapping['reply'] && !finalMapping['newHost']) {
          alert('请至少映射一个数据维度（搭讪人数/回复人数/新增主播）');
          return;
        }

        let importCount = 0;

        parsedData.forEach(row => {
          const date = finalMapping['date'] ? row[finalMapping['date']] : defaultDate;
          
          let validDate = defaultDate;
          if (finalMapping['date'] && row[finalMapping['date']]) {
            const parsed = new Date(row[finalMapping['date']]);
            if (!isNaN(parsed.getTime())) {
              validDate = parsed.toISOString().split('T')[0];
            }
          }

          const record = {
            date: validDate,
            approach: parseInt(row[finalMapping['approach']]) || 0,
            reply: parseInt(row[finalMapping['reply']]) || 0,
            newHost: parseInt(row[finalMapping['newHost']]) || 0,
            comments: parseInt(row[finalMapping['comments']]) || 0,
            storyPost: parseInt(row[finalMapping['storyPost']]) || 0,
            video: parseInt(row[finalMapping['video']]) || 0,
            cost: parseInt(row[finalMapping['cost']]) || 0
          };

          if (selectedInternId) {
            dailyRecords[selectedInternId].push({...record});
            importCount++;
          }
        });

        if (selectedInternId) {
          dailyRecords[selectedInternId].sort((a, b) => new Date(a.date) - new Date(b.date));
        }
        saveDataToStorage();
        
        overlay.remove();
        alert(`✅ 成功导入 ${importCount} 条记录！`);
        
        if (selectedInternId) {
          renderDataTable(regionId, selectedInternId);
          renderAnalysis(regionId, selectedInternId);
          renderRanking(regionId);
        }
      });

      overlay.addEventListener('click', (e) => {
        if (e.target === overlay) overlay.remove();
      });
    }

    // 产出分析
    function renderAnalysis(regionId, internId) {
      const card = document.getElementById(`analysisCard-${regionId}`);
      if (!card) return;
      const weekRecords = getWeekRecords(internId);
      const allRecords = dailyRecords[internId] || [];

      if (allRecords.length === 0) {
        card.innerHTML = `<p style="color:#64748b;">暂无数据，请先录入日报。</p>`;
        return;
      }

      const wApproach = weekRecords.reduce((s,r)=> s+r.approach, 0);
      const wReply = weekRecords.reduce((s,r)=> s+r.reply, 0);
      const wHost = weekRecords.reduce((s,r)=> s+r.newHost, 0);
      const wComments = weekRecords.reduce((s,r)=> s+r.comments, 0);
      const wStory = weekRecords.reduce((s,r)=> s+r.storyPost, 0);
      const wVideo = weekRecords.reduce((s,r)=> s+r.video, 0);
      const wCost = weekRecords.reduce((s,r)=> s+r.cost, 0);

      const totalApproach = allRecords.reduce((s,r)=> s+r.approach, 0);
      const totalReply = allRecords.reduce((s,r)=> s+r.reply, 0);
      const totalHost = allRecords.reduce((s,r)=> s+r.newHost, 0);
      const totalComments = allRecords.reduce((s,r)=> s+r.comments, 0);
      const totalStory = allRecords.reduce((s,r)=> s+r.storyPost, 0);
      const totalVideo = allRecords.reduce((s,r)=> s+r.video, 0);
      const totalCost = allRecords.reduce((s,r)=> s+r.cost, 0);

      const standard = weeklyStandards[regionId] || { approach: 0, reply: 0, newHost: 0, comments: 0, storyPost: 0, video: 0, cost: 0 };

      const checks = [
        { label: '搭讪人数', value: wApproach, std: standard.approach },
        { label: '回复人数', value: wReply, std: standard.reply },
        { label: '新增主播', value: wHost, std: standard.newHost },
        { label: '评论数', value: wComments, std: standard.comments },
        { label: 'Story/Post', value: wStory, std: standard.storyPost },
        { label: '视频数', value: wVideo, std: standard.video },
        { label: '花费', value: wCost, std: standard.cost }
      ];

      const passCount = checks.filter(c => c.value >= c.std).length;
      const totalChecks = checks.length;

      let suggestion = '';
      if (passCount === totalChecks) suggestion = '🎉 本周全部达标！表现优秀，继续保持！';
      else if (passCount >= totalChecks * 0.7) suggestion = '👍 大部分指标达标，继续加油！';
      else if (passCount >= totalChecks * 0.4) suggestion = '📈 还有提升空间，重点关注未达标项。';
      else suggestion = '⚠️ 多项指标未达标，需要制定改进计划。';

      card.innerHTML = `
        <h4 style="margin-bottom:12px;"><i class="fas fa-chart-pie"></i> 本周产出 vs 周标准</h4>
        <div style="display:grid; grid-template-columns: repeat(4, 1fr); gap:10px; font-size:0.85rem;">
          ${checks.map(c => `
            <div style="padding:8px; background:white; border-radius:8px; text-align:center;">
              <div style="color:#64748b;">${c.label}</div>
              <div style="font-weight:700;">${c.value} <span style="font-size:0.75rem; color:#94a3b8;">/ ${c.std}</span></div>
              <div class="${c.value >= c.std ? 'status-pass' : 'status-fail'}">
                ${c.value >= c.std ? '✓ 达标' : '✗ 未达标'}
              </div>
            </div>
          `).join('')}
        </div>
        <div style="margin-top:10px; font-weight:600; text-align:center;">
          达标率：${passCount}/${totalChecks} (${Math.round(passCount/totalChecks*100)}%)
        </div>
        <hr style="margin:16px 0;">
        <h4 style="margin-bottom:8px;">📊 全部历史汇总</h4>
        <div style="display:flex; gap:24px; flex-wrap:wrap;">
          <div><strong>总搭讪：</strong>${totalApproach}</div><div><strong>回复：</strong>${totalReply}</div>
          <div><strong>新增主播：</strong>${totalHost}</div><div><strong>评论：</strong>${totalComments}</div>
          <div><strong>Story/Post：</strong>${totalStory}</div><div><strong>视频：</strong>${totalVideo}</div>
          <div><strong>总花费：</strong>$${totalCost}</div>
        </div>
        <div style="margin-top:14px; background:#eef2ff; padding:12px; border-radius:14px;">
          <i class="fas fa-lightbulb" style="color:#4f46e5;"></i> <strong>改善建议：</strong>${suggestion}
        </div>
      `;
    }

    // 渲染本周排名
    function renderRanking(regionId) {
      const rankingDiv = document.getElementById(`rankingList-${regionId}`);
      if (!rankingDiv) return;
      const regionInterns = getInternsByRegion(regionId);

      if (regionInterns.length === 0) {
        rankingDiv.innerHTML = '<p style="color:#94a3b8; font-size:0.85rem;">暂无实习生</p>';
        return;
      }

      const rankings = regionInterns.map(intern => {
        const weekRecords = getWeekRecords(intern.id);
        const score = calculateScore(weekRecords);
        const wApproach = weekRecords.reduce((s,r)=> s+r.approach, 0);
        const wReply = weekRecords.reduce((s,r)=> s+r.reply, 0);
        const wHost = weekRecords.reduce((s,r)=> s+r.newHost, 0);
        return {
          id: intern.id,
          name: intern.name,
          score: score,
          approach: wApproach,
          reply: wReply,
          host: wHost
        };
      });

      rankings.sort((a, b) => b.score - a.score);

      rankingDiv.innerHTML = rankings.map((r, idx) => {
        let rankClass = 'rank-other';
        if (idx === 0) rankClass = 'rank-1';
        else if (idx === 1) rankClass = 'rank-2';
        else if (idx === 2) rankClass = 'rank-3';

        return `
          <div class="rank-item">
            <div style="display:flex; align-items:center; gap:10px;">
              <div class="rank-badge ${rankClass}">${idx + 1}</div>
              <div>
                <div style="font-weight:700;">${r.name}</div>
                <div style="font-size:0.75rem; color:#64748b;">搭讪${r.approach} | 回复${r.reply} | 主播${r.host}</div>
              </div>
            </div>
            <div style="font-weight:700; color:#4f46e5;">${r.score}分</div>
          </div>
        `;
      }).join('');
    }

    // 切换地区
    function switchRegion(regionId) {
      currentRegion = regionId;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelector(`.tab-btn[data-region="${regionId}"]`).classList.add('active');
      document.querySelectorAll('.region-panel').forEach(p => p.classList.remove('active'));
      document.getElementById(`panel-${regionId}`).classList.add('active');
      renderRanking(regionId);
      const regionInterns = getInternsByRegion(regionId);
      if (regionInterns.length > 0) {
        selectedInternId = regionInterns[0].id;
        renderInternList(regionId);
        renderDataTable(regionId, selectedInternId);
        renderAnalysis(regionId, selectedInternId);
      } else {
        selectedInternId = null;
        document.getElementById(`tableContainer-${regionId}`).innerHTML = '<p>暂无实习生，请先添加</p>';
        document.getElementById(`analysisCard-${regionId}`).innerHTML = '<p style="color:#64748b;">暂无实习生</p>';
      }
    }

    // 显示编辑名字弹窗
    function showEditNameModal(internId) {
      const intern = interns.find(i => i.id === internId);
      if (!intern) return;

      const existing = document.querySelector('.modal-overlay');
      if (existing) existing.remove();

      const overlay = document.createElement('div');
      overlay.className = 'modal-overlay';
      overlay.innerHTML = `
        <div class="modal-box">
          <h3><i class="fas fa-user-edit"></i> 修改实习生名字</h3>
          <p style="color:#64748b; margin-bottom:12px;">当前名字：<strong>${intern.name}</strong></p>
          <input type="text" id="newNameInput" value="${intern.name}" placeholder="请输入新名字" autocomplete="off">
          <div class="modal-actions">
            <button class="cancel-btn" id="cancelEditBtn">取消</button>
            <button class="confirm-btn" id="confirmEditBtn">确认修改</button>
          </div>
        </div>
      `;
      document.body.appendChild(overlay);

      const inputEl = document.getElementById('newNameInput');
      setTimeout(() => {
        inputEl.focus();
        inputEl.select();
      }, 150);

      document.getElementById('cancelEditBtn').addEventListener('click', () => overlay.remove());
      document.getElementById('confirmEditBtn').addEventListener('click', () => {
        const newName = inputEl.value.trim();
        if (!newName) {
          alert('名字不能为空');
          inputEl.focus();
          return;
        }
        intern.name = newName;
        saveInternsToStorage();
        const nameDisplay = document.getElementById(`nameDisplay-${internId}`);
        if (nameDisplay) nameDisplay.textContent = newName;
        overlay.remove();
        const currentPanel = document.querySelector('.region-panel.active');
        if (currentPanel) {
          const regionId = currentPanel.id.replace('panel-', '');
          renderInternList(regionId);
          renderRanking(regionId);
          const items = document.querySelectorAll(`#internList-${regionId} .intern-item`);
          items.forEach(el => {
            if (el.dataset.id === internId) el.classList.add('selected');
          });
          if (selectedInternId === internId) {
            renderAnalysis(regionId, internId);
          }
        }
      });

      overlay.addEventListener('click', (e) => {
        if (e.target === overlay) overlay.remove();
      });

      inputEl.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          document.getElementById('confirmEditBtn').click();
        }
      });
    }

    // 事件绑定
    document.getElementById('regionTabs').addEventListener('click', (e) => {
      const btn = e.target.closest('.tab-btn');
      if (!btn) return;
      switchRegion(btn.dataset.region);
    });

    // 初始化
    renderAllPanels();
    const firstTw = getInternsByRegion('taiwan')[0];
    if (firstTw) {
      selectedInternId = firstTw.id;
      setTimeout(() => {
        renderInternList('taiwan');
        renderDataTable('taiwan', selectedInternId);
        renderAnalysis('taiwan', selectedInternId);
        renderRanking('taiwan');
      }, 20);
    }
  })();
</script>
</body>
</html>
