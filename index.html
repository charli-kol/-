<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
  <title>KOL实习生管理系统 · 多地区日报分析</title>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f5f7fc;
      color: #1e293b;
      padding: 30px 25px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }

    .app-container {
      max-width: 1400px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    .top-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      background: white;
      padding: 18px 30px;
      border-radius: 24px;
      box-shadow: 0 10px 25px -10px rgba(0,0,0,0.04);
    }

    .logo h1 {
      font-size: 1.8rem;
      font-weight: 700;
      background: linear-gradient(135deg, #1e293b, #4f46e5);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .logo span {
      font-size: 0.9rem;
      color: #64748b;
      font-weight: 500;
    }

    .region-tabs {
      display: flex;
      gap: 10px;
      background: #f1f5f9;
      padding: 6px;
      border-radius: 40px;
    }

    .tab-btn {
      padding: 10px 24px;
      border: none;
      background: transparent;
      border-radius: 30px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      color: #475569;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .tab-btn i { font-size: 0.9rem; }

    .tab-btn.active {
      background: white;
      color: #4f46e5;
      box-shadow: 0 4px 12px rgba(79,70,229,0.15);
    }

    .region-panel {
      display: none;
      gap: 24px;
      flex-wrap: wrap;
    }

    .region-panel.active { display: flex; }

    .intern-sidebar {
      flex: 0 0 300px;
      background: white;
      border-radius: 24px;
      padding: 20px;
      box-shadow: 0 10px 25px -8px rgba(0,0,0,0.04);
      height: fit-content;
    }

    .data-main {
      flex: 1;
      background: white;
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 10px 25px -8px rgba(0,0,0,0.04);
      min-width: 0;
    }

    .intern-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 12px;
      border-radius: 16px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: 0.2s;
      border: 1px solid transparent;
    }

    .intern-item:hover { background: #f8fafc; }
    .intern-item.selected { background: #eef2ff; border-color: #4f46e5; }
    .intern-name { font-weight: 700; }

    .add-intern-btn {
      background: #10b981;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 30px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 12px;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .standard-btn {
      background: #f59e0b;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 30px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 0.85rem;
    }

    .table-wrapper {
      overflow-x: auto;
      border-radius: 16px;
      border: 1px solid #e9eef3;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
      white-space: nowrap;
    }

    th {
      background: #f8fafc;
      padding: 14px 12px;
      text-align: left;
      font-weight: 600;
      color: #334155;
    }

    td {
      padding: 12px;
      border-bottom: 1px solid #f1f5f9;
    }

    .batch-input-row { background: #fdf4ff; }

    input, select {
      padding: 8px 12px;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      font-family: inherit;
      width: 100px;
    }

    .small-input { width: 80px; }

    .analysis-card {
      background: #f9fafb;
      border-radius: 20px;
      padding: 20px;
      margin-top: 24px;
    }

    .ranking-card {
      background: #fefce8;
      border-radius: 20px;
      padding: 20px;
      margin-top: 16px;
    }

    .rank-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      border-radius: 12px;
      margin-bottom: 6px;
      background: white;
    }

    .rank-badge {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.85rem;
      color: white;
    }

    .rank-1 { background: #f59e0b; }
    .rank-2 { background: #94a3b8; }
    .rank-3 { background: #b45309; }
    .rank-other { background: #cbd5e1; color: #475569; }

    .status-pass { color: #10b981; font-weight: 700; }
    .status-fail { color: #ef4444; font-weight: 700; }

    button {
      background: #4f46e5;
      border: none;
      color: white;
      font-weight: 600;
      padding: 10px 20px;
      border-radius: 30px;
      cursor: pointer;
      transition: 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    button.secondary { background: #f1f5f9; color: #1e293b; }
    button.danger { background: #ef4444; color: white; }

    .edit-name-btn, .delete-intern-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px 6px;
      font-size: 0.85rem;
    }

    .edit-name-btn { color: #64748b; }
    .edit-name-btn:hover { color: #4f46e5; }
    .delete-intern-btn { color: #ef4444; }
    .delete-intern-btn:hover { color: #dc2626; }

    /* 分页 */
    .pagination {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 16px;
      flex-wrap: wrap;
    }

    .pagination button {
      padding: 8px 14px;
      font-size: 0.85rem;
      background: #f1f5f9;
      color: #334155;
      border-radius: 8px;
    }

    .pagination button:disabled { opacity: 0.4; cursor: not-allowed; }
    .pagination .page-info { font-size: 0.85rem; color: #64748b; padding: 0 8px; }

    /* 上传区域 */
    .upload-area {
      border: 2px dashed #cbd5e1;
      border-radius: 16px;
      padding: 30px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      background: #fafbfc;
      margin-top: 16px;
    }

    .upload-area:hover { border-color: #4f46e5; background: #f5f3ff; }
    .upload-area i { font-size: 2.5rem; color: #4f46e5; margin-bottom: 10px; }
    .upload-area p { color: #64748b; margin: 5px 0; }
    .upload-area .file-types { font-size: 0.8rem; color: #94a3b8; }

    .mapping-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
      margin-top: 16px;
    }

    .mapping-table th, .mapping-table td {
      padding: 10px 14px;
      border: 1px solid #e2e8f0;
      text-align: left;
    }

    .mapping-table th { background: #f8fafc; font-weight: 600; }
    .preview-scroll {
      max-height: 250px;
      overflow-y: auto;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      margin-top: 12px;
    }

    .tag {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 600;
      margin: 2px;
    }

    .tag-success { background: #d1fae5; color: #065f46; }
    .tag-warning { background: #fef3c7; color: #92400e; }

    /* 弹窗 */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      backdrop-filter: blur(2px);
    }

    .modal-box {
      background: white;
      border-radius: 20px;
      padding: 28px 30px;
      width: 450px;
      max-width: 90vw;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.25);
      animation: modalFadeIn 0.2s ease;
      max-height: 85vh;
      overflow-y: auto;
    }

    @keyframes modalFadeIn {
      from { opacity: 0; transform: scale(0.95) translateY(-10px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .modal-box h3 {
      margin-bottom: 16px;
      font-size: 1.2rem;
      color: #1e293b;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .modal-box label { display: block; font-weight: 600; margin-bottom: 6px; color: #475569; font-size: 0.9rem; }
    .modal-box input, .modal-box select {
      width: 100%;
      padding: 10px 14px;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      font-size: 0.95rem;
      margin-bottom: 14px;
      outline: none;
      box-sizing: border-box;
    }

    .modal-box input:focus, .modal-box select:focus { border-color: #4f46e5; }

    .modal-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 8px;
    }

    .modal-actions button { padding: 10px 24px; border-radius: 25px; font-weight: 600; cursor: pointer; border: none; font-size: 0.9rem; }
    .modal-actions .cancel-btn { background: #f1f5f9; color: #475569; }
    .modal-actions .confirm-btn { background: #4f46e5; color: white; }

    .standard-row {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 10px;
    }

    .standard-row label { min-width: 100px; margin-bottom: 0; }
    .standard-row input { width: 100px; margin-bottom: 0; }

    .toolbar {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    /* 视图切换 */
    .view-tabs {
      display: flex;
      gap: 4px;
      background: #f1f5f9;
      padding: 4px;
      border-radius: 20px;
      margin-bottom: 16px;
    }

    .view-tab {
      padding: 8px 20px;
      border: none;
      background: transparent;
      border-radius: 16px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      color: #64748b;
      transition: 0.2s;
    }

    .view-tab.active { background: white; color: #4f46e5; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }

    /* 汇总卡片 */
    .summary-cards { display: block; margin-bottom: 20px; }

    .summary-card {
      background: white;
      border-radius: 14px;
      padding: 12px 16px;
      text-align: center;
      border: 1px solid #e9eef3;
      flex: 0 0 auto;
      min-width: 100px;
    }

    .summary-card .value { font-size: 1.2rem; font-weight: 700; color: #1e293b; }
    .summary-card .label { font-size: 0.75rem; color: #64748b; margin-top: 4px; }
    .summary-card .trend { font-size: 0.7rem; margin-top: 4px; }
    .trend-up { color: #10b981; }
    .trend-down { color: #ef4444; }
    .trend-flat { color: #94a3b8; }

    .dimension-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 12px;
    }

    .dim-tag {
      padding: 6px 12px;
      border-radius: 16px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid #e2e8f0;
      background: white;
      color: #64748b;
      transition: 0.2s;
    }

    .dim-tag.active { background: #4f46e5; color: white; border-color: #4f46e5; }

    /* 奖金模块 */
    .bonus-card {
      background: linear-gradient(135deg, #fef3c7, #fde68a);
      border-radius: 20px;
      padding: 20px;
      margin-top: 16px;
      border: 1px solid #fcd34d;
    }

    .bonus-card h4 { color: #92400e; margin-bottom: 12px; }
    .bonus-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.8rem;
      background: white;
      border-radius: 12px;
      overflow: hidden;
    }

    .bonus-table th {
      background: #fef3c7;
      padding: 10px 12px;
      text-align: center;
      font-weight: 700;
      color: #92400e;
      font-size: 0.75rem;
    }

    .bonus-table td {
      padding: 8px 12px;
      text-align: center;
      border-bottom: 1px solid #fef3c7;
      font-weight: 600;
    }

    .bonus-highlight { background: #fef3c7; font-weight: 700; color: #92400e; }
    .period-selector { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
    .period-selector input { width: 140px; }
    .period-selector label { font-weight: 600; font-size: 0.85rem; color: #475569; }

    .rule-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.7rem;
      margin-top: 8px;
      background: white;
      border-radius: 8px;
      overflow: hidden;
    }

    .rule-table th, .rule-table td { padding: 4px 8px; text-align: center; border: 1px solid #e9eef3; }
    .rule-table th { background: #f8fafc; font-size: 0.65rem; }

    /* 筛选面板 */
    .filter-panel {
      background: white;
      border-radius: 16px;
      padding: 14px 18px;
      margin-bottom: 16px;
      border: 1px solid #e2e8f0;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .filter-panel label { font-weight: 600; font-size: 0.85rem; color: #475569; white-space: nowrap; }
    .filter-panel input[type="date"] { width: 140px; padding: 8px 12px; border: 1px solid #e2e8f0; border-radius: 10px; font-size: 0.85rem; }
    .quick-btns { display: flex; gap: 4px; }

    .quick-btn {
      padding: 6px 12px;
      font-size: 0.75rem;
      border-radius: 16px;
      border: 1px solid #e2e8f0;
      background: white;
      color: #475569;
      cursor: pointer;
      font-weight: 500;
      transition: 0.2s;
      white-space: nowrap;
    }

    .quick-btn:hover { background: #eef2ff; border-color: #4f46e5; }
    .quick-btn.active-filter { background: #4f46e5; color: white; border-color: #4f46e5; }
    .filter-actions { display: flex; gap: 6px; }
    .filter-actions button { padding: 8px 16px; font-size: 0.8rem; border-radius: 20px; }
    .filter-info { font-size: 0.75rem; color: #64748b; margin-left: auto; }

    @media (max-width: 850px) {
      .region-panel { flex-direction: column; }
      .intern-sidebar { flex: auto; }
      .filter-panel { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>
<div class="app-container">
  <div class="top-header">
    <div class="logo">
      <h1>📊 KOL实习生管理</h1>
      <span>台湾 · 土耳其 · 西语大区 · 巴西</span>
    </div>
    <div class="region-tabs" id="regionTabs">
      <button class="tab-btn active" data-region="taiwan"><i class="fas fa-flag"></i> 台湾</button>
      <button class="tab-btn" data-region="turkey"><i class="fas fa-flag"></i> 土耳其</button>
      <button class="tab-btn" data-region="spanish"><i class="fas fa-globe"></i> 西语大区</button>
      <button class="tab-btn" data-region="brazil"><i class="fas fa-flag"></i> 巴西</button>
    </div>
  </div>

  <div id="regionPanelsContainer"></div>
</div>

<script>
  (function() {
    const REGIONS = [
      { id: 'taiwan', name: '台湾', icon: 'fa-flag' },
      { id: 'turkey', name: '土耳其', icon: 'fa-flag' },
      { id: 'spanish', name: '西语大区', icon: 'fa-globe' },
      { id: 'brazil', name: '巴西', icon: 'fa-flag' }
    ];

    const ALL_DIMENSIONS = [
      { key: 'approach', label: '搭讪人数', icon: '💬' },
      { key: 'reply', label: '回复人数', icon: '↩️' },
      { key: 'newHost', label: '新增主播', icon: '🎤' },
      { key: 'comments', label: '评论数', icon: '💭' },
      { key: 'storyPost', label: 'Story/Post', icon: '📱' },
      { key: 'video', label: '视频数', icon: '🎬' },
      { key: 'cost', label: '花费($)', icon: '💰' }
    ];

    let interns = [];
    let dailyRecords = {};
    let weeklyStandards = {};
    let currentRegion = 'taiwan';
    let selectedInternId = null;
    let selectedRows = {};
    let dataViewMode = {};
    let filterState = {};
    let currentPage = {};
    const PAGE_SIZE = 10;

    // ========== 数据存储 ==========
    function loadInternsFromStorage() {
      const saved = localStorage.getItem('kolInterns');
      if (saved) { try { interns = JSON.parse(saved); } catch (e) { initDefaultInterns(); } }
      else { initDefaultInterns(); saveInternsToStorage(); }
    }

    function initDefaultInterns() {
      interns = [
        { id: 'tw1', name: '陈雅婷', region: 'taiwan' }, { id: 'tw2', name: '林俊杰', region: 'taiwan' },
        { id: 'tr1', name: 'Elif Demir', region: 'turkey' }, { id: 'tr2', name: 'Mehmet Yılmaz', region: 'turkey' },
        { id: 'es1', name: 'Sofía García', region: 'spanish' }, { id: 'es2', name: 'Carlos Ruiz', region: 'spanish' },
        { id: 'br1', name: 'Ana Silva', region: 'brazil' }, { id: 'br2', name: 'João Costa', region: 'brazil' }
      ];
    }

    function saveInternsToStorage() { localStorage.setItem('kolInterns', JSON.stringify(interns)); }

    function generateInternId(regionId) {
      const regionInterns = interns.filter(i => i.region === regionId);
      const prefix = regionId.substring(0, 2);
      let maxNum = 0;
      regionInterns.forEach(intern => {
        const match = intern.id.match(/\d+$/);
        if (match) { const num = parseInt(match[0]); if (num > maxNum) maxNum = num; }
      });
      return `${prefix}${maxNum + 1}`;
    }

    function loadDataFromStorage() {
      const saved = localStorage.getItem('kolDailyRecords');
      if (saved) { try { dailyRecords = JSON.parse(saved); } catch (e) { initEmptyRecords(); } }
      else { initEmptyRecords(); seedSampleData(); saveDataToStorage(); }
    }

    function initEmptyRecords() { dailyRecords = {}; interns.forEach(intern => { dailyRecords[intern.id] = []; }); }
    function saveDataToStorage() { localStorage.setItem('kolDailyRecords', JSON.stringify(dailyRecords)); }

    function seedSampleData() {
      const today = new Date().toISOString().split('T')[0];
      const y = new Date(Date.now() - 86400000).toISOString().split('T')[0];
      if (dailyRecords['tw1']) dailyRecords['tw1'].push({ date: y, approach: 12, reply: 8, newHost: 2, comments: 34, storyPost: 5, video: 2, cost: 150 });
      if (dailyRecords['tw1']) dailyRecords['tw1'].push({ date: today, approach: 15, reply: 10, newHost: 3, comments: 40, storyPost: 6, video: 3, cost: 200 });
      if (dailyRecords['tr1']) dailyRecords['tr1'].push({ date: y, approach: 20, reply: 14, newHost: 4, comments: 55, storyPost: 8, video: 4, cost: 320 });
      if (dailyRecords['es1']) dailyRecords['es1'].push({ date: today, approach: 18, reply: 12, newHost: 5, comments: 48, storyPost: 7, video: 3, cost: 280 });
      if (dailyRecords['br1']) dailyRecords['br1'].push({ date: y, approach: 22, reply: 16, newHost: 6, comments: 62, storyPost: 10, video: 5, cost: 400 });
    }

    function loadStandardsFromStorage() {
      const saved = localStorage.getItem('kolWeeklyStandards');
      if (saved) { try { weeklyStandards = JSON.parse(saved); } catch (e) { initDefaultStandards(); } }
      else { initDefaultStandards(); saveStandardsToStorage(); }
    }

    function initDefaultStandards() {
      weeklyStandards = {};
      REGIONS.forEach(region => {
        weeklyStandards[region.id] = {
          enabledDimensions: ALL_DIMENSIONS.map(d => d.key),
          targets: { approach: 50, reply: 30, newHost: 8, comments: 100, storyPost: 20, video: 8, cost: 500 }
        };
      });
    }

    function saveStandardsToStorage() { localStorage.setItem('kolWeeklyStandards', JSON.stringify(weeklyStandards)); }

    // ========== 初始化 ==========
    loadInternsFromStorage();
    loadDataFromStorage();
    loadStandardsFromStorage();

    // ========== 工具函数 ==========
    function getInternsByRegion(regionId) { return interns.filter(i => i.region === regionId); }
    function getRegionName(regionId) { const r = REGIONS.find(r => r.id === regionId); return r ? r.name : regionId; }

    function getWeekStart() {
      const now = new Date();
      const day = now.getDay();
      const diff = now.getDate() - day + (day === 0 ? -6 : 1);
      return new Date(new Date(now.setDate(diff)).toISOString().split('T')[0]);
    }

    function getMonthStart() {
      const now = new Date();
      return new Date(now.getFullYear(), now.getMonth(), 1).toISOString().split('T')[0];
    }

    function getWeekRecords(internId) {
      const weekStart = getWeekStart().toISOString().split('T')[0];
      return (dailyRecords[internId] || []).filter(r => r.date >= weekStart);
    }

    function getMonthRecords(internId) {
      const monthStart = getMonthStart();
      return (dailyRecords[internId] || []).filter(r => r.date >= monthStart);
    }

    function calculateScore(records) {
      return records.reduce((s, r) => s + r.approach + r.reply + r.newHost * 3 + r.comments + r.storyPost * 2 + r.video * 3, 0);
    }

    // ========== 筛选功能 ==========
    function initFilterState(regionId) {
      if (!filterState[regionId]) {
        const now = new Date();
        const day = now.getDay();
        const diff = now.getDate() - day + (day === 0 ? -6 : 1);
        const monday = new Date(now.setDate(diff));
        const sunday = new Date(monday);
        sunday.setDate(sunday.getDate() + 6);
        filterState[regionId] = {
          startDate: monday.toISOString().split('T')[0],
          endDate: sunday.toISOString().split('T')[0],
          period: 'week'
        };
      }
    }

    function setFilterPeriod(regionId, period) {
      const now = new Date();
      let startDate, endDate;
      switch (period) {
        case 'today':
          startDate = new Date().toISOString().split('T')[0];
          endDate = startDate;
          break;
        case 'week':
          const day = now.getDay();
          const diff = now.getDate() - day + (day === 0 ? -6 : 1);
          const monday = new Date(now.setDate(diff));
          const sunday = new Date(monday);
          sunday.setDate(sunday.getDate() + 6);
          startDate = monday.toISOString().split('T')[0];
          endDate = sunday.toISOString().split('T')[0];
          break;
        case 'month':
          startDate = new Date(now.getFullYear(), now.getMonth(), 1).toISOString().split('T')[0];
          endDate = new Date(now.getFullYear(), now.getMonth() + 1, 0).toISOString().split('T')[0];
          break;
        case 'lastMonth':
          startDate = new Date(now.getFullYear(), now.getMonth() - 1, 1).toISOString().split('T')[0];
          endDate = new Date(now.getFullYear(), now.getMonth(), 0).toISOString().split('T')[0];
          break;
        case 'all':
          startDate = ''; endDate = '';
          break;
        default: return;
      }
      filterState[regionId] = { startDate, endDate, period };
      const startInput = document.getElementById(`filterStart-${regionId}`);
      const endInput = document.getElementById(`filterEnd-${regionId}`);
      if (startInput) startInput.value = startDate;
      if (endInput) endInput.value = endDate;
      updateQuickBtnStyles(regionId, period);
      updateFilterInfo(regionId);
    }

    function updateQuickBtnStyles(regionId, activePeriod) {
      const btns = document.querySelectorAll(`#quickBtns-${regionId} .quick-btn`);
      btns.forEach(btn => {
        btn.classList.remove('active-filter');
        if (btn.dataset.period === activePeriod) btn.classList.add('active-filter');
      });
    }

    function updateFilterInfo(regionId) {
      const infoEl = document.getElementById(`filterInfo-${regionId}`);
      if (!infoEl) return;
      const state = filterState[regionId];
      if (!state || (!state.startDate && !state.endDate)) { infoEl.textContent = '显示：全部数据'; }
      else if (state.startDate && state.endDate && state.startDate === state.endDate) { infoEl.textContent = '显示：' + state.startDate; }
      else { infoEl.textContent = '显示：' + (state.startDate || '最早') + ' 至 ' + (state.endDate || '最晚'); }
    }

    function getFilterDates(regionId) {
      if (!filterState[regionId]) initFilterState(regionId);
      return filterState[regionId];
    }

    function applyCustomFilter(regionId) {
      const startInput = document.getElementById(`filterStart-${regionId}`);
      const endInput = document.getElementById(`filterEnd-${regionId}`);
      const startDate = startInput ? startInput.value : '';
      const endDate = endInput ? endInput.value : '';
      if (!startDate && !endDate) { setFilterPeriod(regionId, 'all'); return; }
      if (startDate && endDate && startDate > endDate) { alert('开始日期不能晚于结束日期'); return; }
      filterState[regionId] = { startDate, endDate, period: 'custom' };
      updateQuickBtnStyles(regionId, 'custom');
      updateFilterInfo(regionId);
    }

      overlay.innerHTML = `
        <div class="modal-box" style="width:700px; max-width:95vw;">

              <h4 style="font-size:1rem;">📋 数据预览</h4>
              <span id="rowCount-${regionId}" style="font-size:0.85rem; color:#64748b;"></span>
            </div>
            <div class="preview-scroll" id="previewTable-${regionId}"></div>
            <div class="pagination" id="previewPagination-${regionId}"></div>
            <div style="margin-top:16px;"><h4 style="font-size:1rem; margin-bottom:8px;">🔗 列映射设置</h4><div id="mappingConfig-${regionId}"></div></div>
            <div style="margin-top:16px;"><label>📅 默认日期</label><input type="date" id="defaultDate-${regionId}" style="width:200px;" value="${new Date().toISOString().split('T')[0]}"></div>
            <div class="modal-actions" style="margin-top:16px;">
              <button class="cancel-btn" id="cancelUploadBtn">取消</button>
              <button class="confirm-btn" id="confirmUploadBtn"><i class="fas fa-check"></i> 确认导入</button>
            </div>
          </div>
        </div>
      `;
      document.body.appendChild(overlay);

      let parsedData = [], fileHeaders = [], columnMapping = {}, previewPage = 1;
      const PREVIEW_PAGE_SIZE = 8;
      const dropZone = document.getElementById(`uploadDropZone-${regionId}`);
      const fileInput = document.getElementById(`fileInput-${regionId}`);

      dropZone.addEventListener('click', () => fileInput.click());
      dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.style.borderColor = '#4f46e5'; });
      dropZone.addEventListener('dragleave', () => { dropZone.style.borderColor = '#cbd5e1'; });
      dropZone.addEventListener('drop', (e) => { e.preventDefault(); const file = e.dataTransfer.files[0]; if (file) processFile(file); });
      fileInput.addEventListener('change', (e) => { if (e.target.files[0]) processFile(e.target.files[0]); });

      function processFile(file) {
        const fileName = file.name.toLowerCase();
        if (fileName.endsWith('.csv')) {
          const reader = new FileReader();
          reader.onload = function(e) { parseCSV(e.target.result); };
          reader.readAsText(file);
        } else if (fileName.endsWith('.xlsx') || fileName.endsWith('.xls')) {
          const reader = new FileReader();
          reader.onload = function(e) {
            try {
              const data = new Uint8Array(e.target.result);
              const workbook = XLSX.read(data, { type: 'array' });
              const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
              const csvText = XLSX.utils.sheet_to_csv(firstSheet);
              parseCSV(csvText);
            } catch (err) { alert('Excel解析失败：' + err.message); }
          };
          reader.readAsArrayBuffer(file);
        } else { alert('请上传 .csv 或 .xlsx 文件'); }
      }

      function parseCSV(text) {
        const lines = text.split('\n').filter(line => line.trim() !== '');
        if (lines.length < 2) { alert('文件内容不足'); return; }
        fileHeaders = parseCSVLine(lines[0]);
        parsedData = [];
        for (let i = 1; i < lines.length; i++) {
          const values = parseCSVLine(lines[i]);
          if (values.length > 0 && values.some(v => v.trim() !== '')) {
            const row = {};
            fileHeaders.forEach((header, idx) => { row[header] = values[idx] || ''; });
            parsedData.push(row);
          }
        }
        if (parsedData.length === 0) { alert('未解析到有效数据'); return; }
        autoMapColumns();
        previewPage = 1;
        showPreview();
      }

      function parseCSVLine(line) {
        const result = []; let current = '', inQuotes = false;
        for (let i = 0; i < line.length; i++) {
          const char = line[i];
          if (char === '"') inQuotes = !inQuotes;
          else if (char === ',' && !inQuotes) { result.push(current.trim()); current = ''; }
          else current += char;
        }
        result.push(current.trim());
        return result;
      }

      function autoMapColumns() {
        const targetFields = { date: ['日期','date','时间'], approach: ['搭讪','approach'], reply: ['回复','reply'], newHost: ['主播','host','newHost'], comments: ['评论','comments'], storyPost: ['story','post'], video: ['视频','video'], cost: ['花费','cost'] };
        columnMapping = {};
        fileHeaders.forEach(header => {
          const hl = header.toLowerCase().replace(/[\s\/\-_]/g, '');
          for (const [field, keywords] of Object.entries(targetFields)) {
            if (columnMapping[field]) continue;
            for (const kw of keywords) {
              if (hl.includes(kw.toLowerCase().replace(/[\s\/\-_]/g, ''))) { columnMapping[field] = header; break; }
            }
          }
        });
      }

      function renderPreviewPage() {
        const totalPages = Math.ceil(parsedData.length / PREVIEW_PAGE_SIZE) || 1;
        if (previewPage > totalPages) previewPage = totalPages;
        const start = (previewPage - 1) * PREVIEW_PAGE_SIZE;
        const pageData = parsedData.slice(start, start + PREVIEW_PAGE_SIZE);
        const previewTable = document.getElementById(`previewTable-${regionId}`);
        let tableHTML = '<table class="mapping-table"><thead><tr>';
        fileHeaders.forEach(h => tableHTML += `<th>${h}</th>`);
        tableHTML += '</tr></thead><tbody>';
        pageData.forEach(row => { tableHTML += '<tr>'; fileHeaders.forEach(h => tableHTML += `<td>${row[h] || ''}</td>`); tableHTML += '</tr>'; });
        tableHTML += '</tbody></table>';
        previewTable.innerHTML = tableHTML;
        const pagDiv = document.getElementById(`previewPagination-${regionId}`);
        pagDiv.innerHTML = `<button ${previewPage<=1?'disabled':''} id="prevPreviewPage">上一页</button><span class="page-info">${previewPage}/${totalPages}页</span><button ${previewPage>=totalPages?'disabled':''} id="nextPreviewPage">下一页</button>`;
        document.getElementById('prevPreviewPage')?.addEventListener('click', () => { previewPage--; renderPreviewPage(); });
        document.getElementById('nextPreviewPage')?.addEventListener('click', () => { previewPage++; renderPreviewPage(); });
      }

      function showPreview() {
        document.getElementById(`uploadDropZone-${regionId}`).style.display = 'none';
        document.getElementById(`uploadPreview-${regionId}`).style.display = 'block';
        document.getElementById(`rowCount-${regionId}`).textContent = `共 ${parsedData.length} 行`;
        renderPreviewPage();
        const mappingDiv = document.getElementById(`mappingConfig-${regionId}`);
        const dims = [{ key: 'date', label: '📅 日期' }, ...ALL_DIMENSIONS.map(d => ({ key: d.key, label: d.icon + ' ' + d.label }))];
        mappingDiv.innerHTML = dims.map(dim => {
          const m = columnMapping[dim.key] || '';
          return `<div style="display:flex;align-items:center;gap:12px;margin-bottom:8px;"><label style="min-width:130px;">${dim.label}：</label><select id="map-${dim.key}-${regionId}" style="flex:1;"><option value="">-- 不映射 --</option>${fileHeaders.map(h => `<option value="${h}" ${m===h?'selected':''}>${h}</option>`).join('')}</select>${m?'<span class="tag tag-success">已匹配</span>':'<span class="tag tag-warning">待选择</span>'}</div>`;
        }).join('');
      }

      document.getElementById('cancelUploadBtn').addEventListener('click', () => overlay.remove());
      document.getElementById('confirmUploadBtn').addEventListener('click', () => {
        const finalMapping = {};
        ['date', ...ALL_DIMENSIONS.map(d=>d.key)].forEach(dim => { const s = document.getElementById(`map-${dim}-${regionId}`); if (s&&s.value) finalMapping[dim] = s.value; });
        const defaultDate = document.getElementById(`defaultDate-${regionId}`).value;
        let importCount = 0;
        parsedData.forEach(row => {
          let validDate = defaultDate;
          if (finalMapping['date'] && row[finalMapping['date']]) { const p = new Date(row[finalMapping['date']]); if (!isNaN(p.getTime())) validDate = p.toISOString().split('T')[0]; }
          const record = { date: validDate };
          ALL_DIMENSIONS.forEach(dim => { record[dim.key] = parseInt(row[finalMapping[dim.key]]) || 0; });
          if (selectedInternId) { dailyRecords[selectedInternId].push({...record}); importCount++; }
        });
        if (selectedInternId) dailyRecords[selectedInternId].sort((a,b) => new Date(a.date) - new Date(b.date));
        saveDataToStorage();
        overlay.remove();
        alert(`✅ 成功导入 ${importCount} 条记录！`);
        if (selectedInternId) { currentPage[selectedInternId]=1; selectedRows[selectedInternId]=new Set(); refreshAllViews(regionId, selectedInternId); renderRanking(regionId); }
      });
      overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });
    }

    // ========== 实习生列表 ==========
    function renderInternList(regionId) {
      const listDiv = document.getElementById(`internList-${regionId}`);
      if (!listDiv) return;
      const regionInterns = getInternsByRegion(regionId);
      listDiv.innerHTML = regionInterns.map(intern => `
        <div class="intern-item ${selectedInternId === intern.id ? 'selected' : ''}" data-id="${intern.id}">
          <span class="intern-name" id="nameDisplay-${intern.id}">${intern.name}</span>
          <div style="display:flex; align-items:center; gap:6px;">
            <button class="edit-name-btn" data-id="${intern.id}" title="修改名字"><i class="fas fa-pen"></i></button>
            <button class="delete-intern-btn" data-id="${intern.id}" title="删除实习生"><i class="fas fa-trash"></i></button>
            <i class="fas fa-chevron-right" style="color:#94a3b8;"></i>
          </div>
        </div>
      `).join('');
      listDiv.querySelectorAll('.intern-item').forEach(item => {
        item.addEventListener('click', function(e) {
          if (e.target.closest('.edit-name-btn') || e.target.closest('.delete-intern-btn')) return;
          selectIntern(this.dataset.id, regionId);
        });
      });
      listDiv.querySelectorAll('.edit-name-btn').forEach(btn => {
        btn.addEventListener('click', function(e) { e.stopPropagation(); showEditNameModal(this.dataset.id); });
      });
      listDiv.querySelectorAll('.delete-intern-btn').forEach(btn => {
        btn.addEventListener('click', function(e) {
          e.stopPropagation();
          if (confirm('确定删除该实习生及所有数据？')) {
            const internId = this.dataset.id;
            interns = interns.filter(i => i.id !== internId);
            delete dailyRecords[internId]; delete selectedRows[internId]; delete currentPage[internId]; delete dataViewMode[internId];
            saveInternsToStorage(); saveDataToStorage();
            if (selectedInternId === internId) selectedInternId = null;
            renderAllPanels(); switchRegion(regionId);
          }
        });
      });
    }

    function selectIntern(internId, regionId) {
      selectedInternId = internId;
      if (!currentPage[internId]) currentPage[internId] = 1;
      if (!selectedRows[internId]) selectedRows[internId] = new Set();
      if (!dataViewMode[internId]) dataViewMode[internId] = 'week';
      initFilterState(regionId);
      document.querySelectorAll(`#internList-${regionId} .intern-item`).forEach(el => { el.classList.remove('selected'); if (el.dataset.id === internId) el.classList.add('selected'); });
      const tabs = document.getElementById(`viewTabs-${regionId}`);
      if (tabs) tabs.querySelectorAll('.view-tab').forEach(t => { t.classList.remove('active'); if (t.dataset.view === dataViewMode[internId]) t.classList.add('active'); });
      const filter = filterState[regionId];
      if (filter) {
        const si = document.getElementById(`filterStart-${regionId}`); if (si) si.value = filter.startDate || '';
        const ei = document.getElementById(`filterEnd-${regionId}`); if (ei) ei.value = filter.endDate || '';
        updateQuickBtnStyles(regionId, filter.period || 'week');
        updateFilterInfo(regionId);
      }
      refreshAllViews(regionId, internId);
    }

    function showEditNameModal(internId) {
      const intern = interns.find(i => i.id === internId);
      if (!intern) return;
      const existing = document.querySelector('.modal-overlay');
      if (existing) existing.remove();
      const overlay = document.createElement('div');
      overlay.className = 'modal-overlay';
      overlay.innerHTML = `
        <div class="modal-box">
          <h3><i class="fas fa-user-edit"></i> 修改名字</h3>
          <p style="color:#64748b; margin-bottom:12px;">当前：<strong>${intern.name}</strong></p>
          <input type="text" id="newNameInput" value="${intern.name}" autocomplete="off">
          <div class="modal-actions">
            <button class="cancel-btn" id="cancelEditBtn">取消</button>
            <button class="confirm-btn" id="confirmEditBtn">确认</button>
          </div>
        </div>
      `;
      document.body.appendChild(overlay);
      const inputEl = document.getElementById('newNameInput');
      setTimeout(() => { inputEl.focus(); inputEl.select(); }, 150);
      document.getElementById('cancelEditBtn').addEventListener('click', () => overlay.remove());
      document.getElementById('confirmEditBtn').addEventListener('click', () => {
        const newName = inputEl.value.trim();
        if (!newName) { alert('名字不能为空'); return; }
        intern.name = newName;
        saveInternsToStorage();
        document.getElementById(`nameDisplay-${internId}`).textContent = newName;
        overlay.remove();
        const panel = document.querySelector('.region-panel.active');
        if (panel) { const rid = panel.id.replace('panel-',''); renderInternList(rid); renderRanking(rid); if (selectedInternId===internId) refreshAllViews(rid, internId); }
      });
      overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });
      inputEl.addEventListener('keypress', (e) => { if (e.key==='Enter') document.getElementById('confirmEditBtn').click(); });
    }

    // ========== 视图刷新 ==========
    function refreshAllViews(regionId, internId) {
      const view = dataViewMode[internId] || 'week';
      const filter = getFilterDates(regionId);
      const cardsDiv = document.getElementById(`summaryCards-${regionId}`);
      if (cardsDiv) cardsDiv.innerHTML = renderStandardDisplay(regionId);
      renderSummaryCardsWithFilter(regionId, internId, view, filter);
      if (view === 'all') {
        document.getElementById(`tableContainer-${regionId}`).style.display = 'block';
        renderDataTable(regionId, internId, filter.startDate, filter.endDate);
      } else {
        document.getElementById(`tableContainer-${regionId}`).style.display = 'none';
      }
      renderAnalysis(regionId, internId);
    }

    function refreshDataDisplay(regionId, internId) { refreshAllViews(regionId, internId); }

    // ========== 周标准展示 ==========
    function renderStandardDisplay(regionId) {
      if (!weeklyStandards[regionId]) { weeklyStandards[regionId] = { enabledDimensions: ALL_DIMENSIONS.map(d=>d.key), targets: {} }; }
      if (!weeklyStandards[regionId].enabledDimensions) weeklyStandards[regionId].enabledDimensions = ALL_DIMENSIONS.map(d=>d.key);
      if (!weeklyStandards[regionId].targets) weeklyStandards[regionId].targets = {};
      const config = weeklyStandards[regionId];
      const visibleDims = ALL_DIMENSIONS.filter(d => config.enabledDimensions.includes(d.key));
      if (visibleDims.length === 0) return '';
      return `
        <div style="grid-column:1/-1; background:#f0f9ff; border-radius:14px; padding:14px 18px; margin-bottom:8px; border:1px solid #bae6fd;">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
            <h4 style="font-size:0.9rem; color:#0369a1; margin:0;"><i class="fas fa-bullseye"></i> 本周标准目标</h4>
            <button onclick="document.getElementById('standardBtn-${regionId}').click()" style="background:#0ea5e9; padding:5px 12px; font-size:0.7rem; border-radius:20px;"><i class="fas fa-edit"></i> 修改</button>
          </div>
          <div style="display:flex; flex-wrap:wrap; gap:8px;">
            ${visibleDims.map(dim => `
              <div style="background:white; border-radius:10px; padding:8px 14px; text-align:center; min-width:70px; flex:0 0 auto;">
                <div style="font-size:0.65rem; color:#64748b;">${dim.icon} ${dim.label}</div>
                <div style="font-weight:700; font-size:1rem; color:#0c4a6e;">${(config.targets[dim.key]||0).toLocaleString()}</div>
                <div style="font-size:0.55rem; color:#94a3b8;">/周</div>
              </div>
            `).join('')}
          </div>
        </div>`;
    }

    // ========== 汇总卡片 ==========
    function renderSummaryCardsWithFilter(regionId, internId, view, filter) {
      const cardsDiv = document.getElementById(`summaryCards-${regionId}`);
      if (!cardsDiv) return;
      if (!weeklyStandards[regionId]) { weeklyStandards[regionId] = { enabledDimensions: ALL_DIMENSIONS.map(d=>d.key), targets: {} }; }
      const targets = weeklyStandards[regionId].targets || {};
      let allRecords = dailyRecords[internId] || [];
      if (filter && filter.startDate && filter.endDate) allRecords = allRecords.filter(r => r.date >= filter.startDate && r.date <= filter.endDate);
      else if (filter && filter.startDate) allRecords = allRecords.filter(r => r.date >= filter.startDate);
      else if (filter && filter.endDate) allRecords = allRecords.filter(r => r.date <= filter.endDate);
      let records;
      if (view === 'week') { const ws = getWeekStart().toISOString().split('T')[0]; records = allRecords.filter(r => r.date >= ws); }
      else if (view === 'month') { const ms = getMonthStart(); records = allRecords.filter(r => r.date >= ms); }
      else records = allRecords;
      if (records.length === 0) { cardsDiv.innerHTML += '<p style="color:#94a3b8; padding:10px; text-align:center;">暂无数据记录</p>'; return; }
      const totals = {};
      ALL_DIMENSIONS.forEach(dim => { totals[dim.key] = records.reduce((s,r) => s + (r[dim.key]||0), 0); });
      cardsDiv.innerHTML += '<div style="margin-top:8px; margin-bottom:10px;"><h4 style="font-size:0.9rem; color:#475569; margin:0;"><i class="fas fa-chart-bar"></i> ' + (view==='week'?'本周':view==='month'?'本月':'筛选范围') + '数据汇总</h4></div>';
      var cardsHTML = '<div style="display:flex; flex-wrap:wrap; gap:10px;">';
      ALL_DIMENSIONS.forEach(function(dim) {
        var target = targets[dim.key] || 0;
        var value = totals[dim.key];
        var pct = target > 0 ? Math.round(value / target * 100) : 0;
        var tc = 'trend-flat', ti = '➡️';
        if (pct >= 100) { tc = 'trend-up'; ti = '✅'; }
        else if (pct >= 70) { tc = 'trend-up'; ti = '📈'; }
        else if (pct < 50) { tc = 'trend-down'; ti = '⚠️'; }
        cardsHTML += '<div class="summary-card" style="flex:0 0 auto; min-width:100px;"><div class="value">' + dim.icon + ' ' + value.toLocaleString() + '</div><div class="label">' + dim.label + '</div>';
        if (target > 0) cardsHTML += '<div class="trend ' + tc + '">' + ti + ' 目标' + target + ' (' + pct + '%)</div>';
        cardsHTML += '</div>';
      });
      cardsHTML += '</div>';
      cardsDiv.innerHTML += cardsHTML;
    }

    // ========== 数据表格 ==========
    function renderDataTable(regionId, internId, filterStartDate, filterEndDate) {
      const container = document.getElementById(`tableContainer-${regionId}`);
      if (!container) return;
      if (!currentPage[internId]) currentPage[internId] = 1;
      if (!selectedRows[internId]) selectedRows[internId] = new Set();
      let allRecords = dailyRecords[internId] || [];
      if (filterStartDate && filterEndDate) allRecords = allRecords.filter(r => r.date >= filterStartDate && r.date <= filterEndDate);
      else if (filterStartDate) allRecords = allRecords.filter(r => r.date >= filterStartDate);
      else if (filterEndDate) allRecords = allRecords.filter(r => r.date <= filterEndDate);
      const totalPages = Math.ceil(allRecords.length / PAGE_SIZE) || 1;
      let page = currentPage[internId];
      if (page > totalPages) page = totalPages;
      if (page < 1) page = 1;
      currentPage[internId] = page;
      const start = (page - 1) * PAGE_SIZE;
      const records = allRecords.slice(start, start + PAGE_SIZE);
      const selectedSet = selectedRows[internId];
      const allCurrentPageSelected = records.length > 0 && records.every((_, idx) => selectedSet.has((page - 1) * PAGE_SIZE + idx));

      let html = `<div class="toolbar" style="justify-content:space-between;">
        <div style="display:flex; gap:8px; align-items:center;">
          <button class="danger" id="batchDeleteBtn-${regionId}" style="padding:8px 16px; font-size:0.85rem;" ${selectedSet.size===0?'disabled':''}><i class="fas fa-trash-alt"></i> 批量删除 (${selectedSet.size})</button>
          <span style="font-size:0.8rem; color:#64748b;">共 ${allRecords.length} 条</span>
        </div>
      </div>
      <div class="table-wrapper"><table>
      <thead><tr><th style="width:40px;"><input type="checkbox" id="selectAll-${regionId}" ${allCurrentPageSelected?'checked':''}></th><th>日期</th>${ALL_DIMENSIONS.map(d=>`<th>${d.icon} ${d.label}</th>`).join('')}<th>操作</th></tr></thead><tbody>`;

      records.forEach((rec, idx) => {
        const gIdx = (page - 1) * PAGE_SIZE + idx;
        html += `<tr><td><input type="checkbox" class="row-checkbox" data-idx="${gIdx}" ${selectedSet.has(gIdx)?'checked':''}></td><td>${rec.date}</td>${ALL_DIMENSIONS.map(d=>`<td>${rec[d.key]||0}${d.key==='cost'?'$':''}</td>`).join('')}<td><button class="secondary" style="padding:4px 10px;" data-delete="${internId}" data-idx="${gIdx}"><i class="fas fa-trash"></i></button></td></tr>`;
      });

      html += `<tr class="batch-input-row"><td></td><td><input type="date" id="batchDate-${regionId}" style="width:120px;"></td>${ALL_DIMENSIONS.map(d=>`<td><input class="small-input" id="batch-${d.key}-${regionId}" placeholder="${d.label}"></td>`).join('')}<td><button id="saveBatchBtn-${regionId}"><i class="fas fa-save"></i> 保存</button></td></tr>`;
      html += `</tbody></table></div>`;
      html += `<div class="pagination"><button ${page<=1?'disabled':''} id="prevPage-${regionId}">上一页</button><span class="page-info">第 ${page}/${totalPages} 页</span><button ${page>=totalPages?'disabled':''} id="nextPage-${regionId}">下一页</button></div>`;
      container.innerHTML = html;

      document.getElementById(`selectAll-${regionId}`)?.addEventListener('change', function() {
        records.forEach((_, idx) => { const gIdx = (page-1)*PAGE_SIZE+idx; if (this.checked) selectedSet.add(gIdx); else selectedSet.delete(gIdx); });
        renderDataTable(regionId, internId, filterStartDate, filterEndDate);
      });
      container.querySelectorAll('.row-checkbox').forEach(cb => {
        cb.addEventListener('change', function() {
          const gIdx = parseInt(this.dataset.idx);
          if (this.checked) selectedSet.add(gIdx); else selectedSet.delete(gIdx);
          renderDataTable(regionId, internId, filterStartDate, filterEndDate);
        });
      });

      document.getElementById(`batchDeleteBtn-${regionId}`)?.addEventListener('click', () => {
        if (selectedSet.size === 0) return;
        if (confirm(`确定删除 ${selectedSet.size} 条记录？`)) {
          Array.from(selectedSet).sort((a,b)=>b-a).forEach(idx => { dailyRecords[internId].splice(idx, 1); });
          selectedRows[internId] = new Set();
          saveDataToStorage();
          const tp = Math.ceil(dailyRecords[internId].length/PAGE_SIZE)||1;
          if (currentPage[internId] > tp) currentPage[internId] = tp;
          refreshAllViews(regionId, internId); renderRanking(regionId);
        }
      });

      container.querySelectorAll('[data-delete]').forEach(btn => {
        btn.addEventListener('click', function() {
          if (confirm('确定删除这条记录？')) {
            const idx = parseInt(this.dataset.idx);
            dailyRecords[internId].splice(idx, 1);
            selectedRows[internId].delete(idx);
            const ns = new Set();
            selectedRows[internId].forEach(i => { if (i>idx) ns.add(i-1); else if (i<idx) ns.add(i); });
            selectedRows[internId] = ns;
            saveDataToStorage();
            const tp = Math.ceil((dailyRecords[internId]||[]).length/PAGE_SIZE)||1;
            if (currentPage[internId] > tp) currentPage[internId] = tp;
            refreshAllViews(regionId, internId); renderRanking(regionId);
          }
        });
      });

      document.getElementById(`prevPage-${regionId}`)?.addEventListener('click', () => { if (currentPage[internId]>1) { currentPage[internId]--; renderDataTable(regionId, internId, filterStartDate, filterEndDate); } });
      document.getElementById(`nextPage-${regionId}`)?.addEventListener('click', () => { if (currentPage[internId]<totalPages) { currentPage[internId]++; renderDataTable(regionId, internId, filterStartDate, filterEndDate); } });
      document.getElementById(`saveBatchBtn-${regionId}`)?.addEventListener('click', () => batchAddRecord(regionId, internId));
    }

    function batchAddRecord(regionId, internId) {
      const date = document.getElementById(`batchDate-${regionId}`).value;
      if (!date) { alert('请选择日期'); return; }
      const record = { date };
      ALL_DIMENSIONS.forEach(dim => { const el = document.getElementById(`batch-${dim.key}-${regionId}`); record[dim.key] = el ? (parseInt(el.value)||0) : 0; });
      dailyRecords[internId].push(record);
      dailyRecords[internId].sort((a,b) => new Date(a.date) - new Date(b.date));
      saveDataToStorage();
      ALL_DIMENSIONS.forEach(dim => { const el = document.getElementById(`batch-${dim.key}-${regionId}`); if (el) el.value = ''; });
      currentPage[internId] = Math.ceil(dailyRecords[internId].length / PAGE_SIZE);
      refreshAllViews(regionId, internId); renderRanking(regionId);
    }

    // ========== 分析 ==========
    function renderAnalysis(regionId, internId) {
      const card = document.getElementById(`analysisCard-${regionId}`);
      if (!card) return;
      if (!weeklyStandards[regionId]) { weeklyStandards[regionId] = { enabledDimensions: ALL_DIMENSIONS.map(d=>d.key), targets: {} }; }
      const config = weeklyStandards[regionId];
      const enabledDims = config.enabledDimensions || ALL_DIMENSIONS.map(d=>d.key);
      const targets = config.targets || {};
      const filter = getFilterDates(regionId);
      let allRecords = dailyRecords[internId] || [];
      if (filter.startDate && filter.endDate) allRecords = allRecords.filter(r => r.date >= filter.startDate && r.date <= filter.endDate);
      else if (filter.startDate) allRecords = allRecords.filter(r => r.date >= filter.startDate);
      else if (filter.endDate) allRecords = allRecords.filter(r => r.date <= filter.endDate);
      const weekRecords = allRecords.filter(r => r.date >= getWeekStart().toISOString().split('T')[0]);
      const monthRecords = allRecords.filter(r => r.date >= getMonthStart());
      if (allRecords.length === 0) { card.innerHTML = '<p style="color:#64748b;">暂无数据</p>'; return; }
      const weekTotals = {}, monthTotals = {};
      ALL_DIMENSIONS.forEach(dim => { weekTotals[dim.key] = weekRecords.reduce((s,r)=>s+(r[dim.key]||0),0); monthTotals[dim.key] = monthRecords.reduce((s,r)=>s+(r[dim.key]||0),0); });
      const checks = ALL_DIMENSIONS.filter(d=>enabledDims.includes(d.key)).map(dim => ({ ...dim, weekValue: weekTotals[dim.key], monthValue: monthTotals[dim.key], target: targets[dim.key]||0 }));
      const passCount = checks.filter(c => c.target > 0 && c.weekValue >= c.target).length;
      const totalChecks = checks.filter(c => c.target > 0).length;
      let suggestion = totalChecks===0 ? '📝 请设置周标准维度。' : passCount===totalChecks ? '🎉 本周全部达标！' : passCount>=totalChecks*0.7 ? '👍 大部分达标，继续加油！' : passCount>=totalChecks*0.4 ? '📈 还有提升空间。' : '⚠️ 多项未达标，需改进。';
      card.innerHTML = `<h4 style="margin-bottom:12px;"><i class="fas fa-chart-pie"></i> 本周 vs 本月产出对比</h4>
        <div style="display:grid; grid-template-columns: repeat(auto-fill, minmax(180px,1fr)); gap:10px; font-size:0.85rem;">
          ${checks.map(c => `
            <div style="padding:10px; background:white; border-radius:10px; text-align:center; border:1px solid #e9eef3;">
              <div style="color:#64748b; font-weight:600;">${c.icon} ${c.label}</div>
              <div style="display:flex; justify-content:center; gap:16px; margin-top:6px;">
                <div><div style="font-size:0.65rem; color:#94a3b8;">本周</div><div style="font-weight:700; font-size:1.1rem;">${c.weekValue.toLocaleString()}</div></div>
                <div><div style="font-size:0.65rem; color:#94a3b8;">本月</div><div style="font-weight:700; font-size:1.1rem;">${c.monthValue.toLocaleString()}</div></div>
              </div>
              ${c.target>0?`<div style="margin-top:4px; font-size:0.7rem;">目标：${c.target} | <span class="${c.weekValue>=c.target?'status-pass':'status-fail'}">${c.weekValue>=c.target?'✓达标':'✗差'+(c.target-c.weekValue)}</span></div>`:'<div style="margin-top:4px; font-size:0.7rem; color:#94a3b8;">未设目标</div>'}
            </div>`).join('')}
        </div>
        ${totalChecks>0?`<div style="margin-top:12px; font-weight:600; text-align:center;">周达标率：${passCount}/${totalChecks} (${Math.round(passCount/totalChecks*100)}%)</div>`:''}
        <div style="margin-top:14px; background:#eef2ff; padding:12px; border-radius:14px;"><i class="fas fa-lightbulb" style="color:#4f46e5;"></i> <strong>改善建议：</strong>${suggestion}</div>`;
    }

    // ========== 排名 ==========
    function renderRanking(regionId) {
      const rankingDiv = document.getElementById(`rankingList-${regionId}`);
      if (!rankingDiv) return;
      const regionInterns = getInternsByRegion(regionId);
      if (regionInterns.length === 0) { rankingDiv.innerHTML = '<p style="color:#94a3b8; font-size:0.85rem;">暂无实习生</p>'; return; }
      const rankings = regionInterns.map(intern => {
        const wr = getWeekRecords(intern.id);
        return { id: intern.id, name: intern.name, score: calculateScore(wr), approach: wr.reduce((s,r)=>s+r.approach,0), reply: wr.reduce((s,r)=>s+r.reply,0), host: wr.reduce((s,r)=>s+r.newHost,0) };
      }).sort((a,b) => b.score - a.score);
      rankingDiv.innerHTML = rankings.map((r, idx) => {
        let rc = idx===0?'rank-1':idx===1?'rank-2':idx===2?'rank-3':'rank-other';
        return `<div class="rank-item"><div style="display:flex; align-items:center; gap:10px;"><div class="rank-badge ${rc}">${idx+1}</div><div><div style="font-weight:700;">${r.name}</div><div style="font-size:0.75rem; color:#64748b;">搭讪${r.approach} | 回复${r.reply} | 主播${r.host}</div></div></div><div style="font-weight:700; color:#4f46e5;">${r.score}分</div></div>`;
      }).join('');
    }

    // ========== 奖金计算 ==========
    function getBonusRate(n) {
      if (n < 2) return { comment: 0, video: 0 };
      if (n >= 3 && n <= 5) return { comment: 0.5, video: 5 };
      if (n >= 6 && n <= 8) return { comment: 0.8, video: 8 };
      if (n >= 9 && n <= 11) return { comment: 1.0, video: 10 };
      if (n >= 12 && n <= 14) return { comment: 1.2, video: 12 };
      if (n >= 15 && n <= 20) return { comment: 1.4, video: 14 };
      if (n >= 21 && n <= 30) return { comment: 1.6, video: 16 };
      if (n >= 31) return { comment: 1.8, video: 18 };
      return { comment: 0, video: 0 };
    }

    function calculateBonus(regionId) {
      const startDate = document.getElementById(`bonusStart-${regionId}`).value;
      const endDate = document.getElementById(`bonusEnd-${regionId}`).value;
      const resultDiv = document.getElementById(`bonusResult-${regionId}`);
      if (!startDate || !endDate) { resultDiv.innerHTML = '<p style="color:#ef4444; font-size:0.8rem;">请选择日期</p>'; return; }
      if (startDate > endDate) { resultDiv.innerHTML = '<p style="color:#ef4444; font-size:0.8rem;">开始日期不能晚于结束日期</p>'; return; }
      const regionInterns = getInternsByRegion(regionId);
      if (regionInterns.length === 0) { resultDiv.innerHTML = '<p style="color:#94a3b8;">暂无实习生</p>'; return; }
      const start = new Date(startDate), end = new Date(endDate);
      const diffDays = Math.ceil((end - start) / (1000*60*60*24)) + 1;
      const totalWeeks = Math.max(1, Math.ceil(diffDays / 7));
      const totalMonths = Math.max(1, Math.ceil(diffDays / 30));
      let html = '<div style="margin-top:12px;"><p style="font-size:0.75rem; color:#64748b;">📅 ' + startDate + ' 至 ' + endDate + '（约' + totalWeeks + '周）</p>';
      html += '<table class="bonus-table"><thead><tr><th>实习生</th><th>新增主播</th><th>评论数</th><th>视频数</th><th>等级</th><th>评论奖金</th><th>视频奖金</th><th>总奖金</th></tr></thead><tbody>';
      let grandTotal = 0;
      regionInterns.forEach(intern => {
        const records = (dailyRecords[intern.id]||[]).filter(r => r.date >= startDate && r.date <= endDate);
        const nh = records.reduce((s,r)=>s+(r.newHost||0),0);
        const cm = records.reduce((s,r)=>s+(r.comments||0),0);
        const vd = records.reduce((s,r)=>s+(r.video||0),0);
        const rate = getBonusRate(nh);
        const cb = cm * rate.comment, vb = vd * rate.video, tb = cb + vb;
        grandTotal += tb;
        let lv = nh<2?'无奖金':nh<=5?'Lv.1':nh<=8?'Lv.2':nh<=11?'Lv.3':nh<=14?'Lv.4':nh<=20?'Lv.5':nh<=30?'Lv.6':'Lv.7';
        html += '<tr><td style="text-align:left;">'+intern.name+'</td><td>'+nh+'</td><td>'+cm+'</td><td>'+vd+'</td><td><span style="background:#fef3c7; padding:2px 8px; border-radius:10px; font-size:0.7rem;">'+lv+'</span></td><td>$'+cb.toFixed(1)+'</td><td>$'+vb.toFixed(1)+'</td><td class="bonus-highlight">$'+tb.toFixed(1)+'</td></tr>';
      });
      html += '<tr style="background:#fef9c3;"><td colspan="7" style="text-align:right; font-weight:700;">💰 周期总奖金：</td><td class="bonus-highlight" style="font-size:1rem;">$'+grandTotal.toFixed(1)+'</td></tr></tbody></table>';
      html += '<div style="display:flex; gap:16px; margin-top:10px; justify-content:center;">';
      html += '<div style="background:white; border-radius:10px; padding:10px 16px; text-align:center; border:1px solid #fcd34d;"><div style="font-size:0.7rem; color:#92400e;">📅 每周平均</div><div style="font-weight:700; font-size:1.2rem; color:#92400e;">$'+(grandTotal/totalWeeks).toFixed(1)+'</div></div>';
      html += '<div style="background:white; border-radius:10px; padding:10px 16px; text-align:center; border:1px solid #fcd34d;"><div style="font-size:0.7rem; color:#92400e;">📆 每月平均</div><div style="font-weight:700; font-size:1.2rem; color:#92400e;">$'+(grandTotal/totalMonths).toFixed(1)+'</div></div>';
      html += '</div></div>';
      resultDiv.innerHTML = html;
    }

    // ========== 地区切换 ==========
    function switchRegion(regionId) {
      currentRegion = regionId;
      initFilterState(regionId);
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelector(`.tab-btn[data-region="${regionId}"]`).classList.add('active');
      document.querySelectorAll('.region-panel').forEach(p => p.classList.remove('active'));
      document.getElementById(`panel-${regionId}`).classList.add('active');
      renderRanking(regionId);
      const filter = filterState[regionId];
      if (filter) {
        setTimeout(() => {
          const si = document.getElementById(`filterStart-${regionId}`); if (si) si.value = filter.startDate || '';
          const ei = document.getElementById(`filterEnd-${regionId}`); if (ei) ei.value = filter.endDate || '';
          updateQuickBtnStyles(regionId, filter.period || 'week');
          updateFilterInfo(regionId);
        }, 50);
      }
      const regionInterns = getInternsByRegion(regionId);
      if (regionInterns.length > 0) {
        selectedInternId = regionInterns[0].id;
        if (!currentPage[selectedInternId]) currentPage[selectedInternId] = 1;
        if (!selectedRows[selectedInternId]) selectedRows[selectedInternId] = new Set();
        if (!dataViewMode[selectedInternId]) dataViewMode[selectedInternId] = 'week';
        renderInternList(regionId);
        refreshAllViews(regionId, selectedInternId);
      } else {
        selectedInternId = null;
        document.getElementById(`tableContainer-${regionId}`).innerHTML = '<p>暂无实习生</p>';
        document.getElementById(`summaryCards-${regionId}`).innerHTML = '';
        document.getElementById(`analysisCard-${regionId}`).innerHTML = '<p style="color:#64748b;">暂无实习生</p>';
      }
    }

    // ========== 事件绑定与初始化 ==========
    document.getElementById('regionTabs').addEventListener('click', (e) => {
      const btn = e.target.closest('.tab-btn');
      if (!btn) return;
      switchRegion(btn.dataset.region);
    });

    renderAllPanels();
    const firstTw = getInternsByRegion('taiwan')[0];
    if (firstTw) {
      selectedInternId = firstTw.id;
      currentPage[selectedInternId] = 1;
      selectedRows[selectedInternId] = new Set();
      dataViewMode[selectedInternId] = 'week';
      initFilterState('taiwan');
      setTimeout(() => {
        renderInternList('taiwan');
        refreshAllViews('taiwan', selectedInternId);
        renderRanking('taiwan');
      }, 50);
    }
  })();
</script>
</body>
</html>
